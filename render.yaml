services:
  - type: web
    name: gapago
    runtime: python
    buildCommand: cd web/landing && npm install && npm run build && cd ../.. && pip install -r requirements.txt
    startCommand: python main.py serve
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.12"
      - key: NODE_VERSION
        value: "20.18.0"
      - key: LLM_PROVIDER
        value: azure
      - key: RERANK_MODELS
        value: light
      # 기동 시 모델 프리로드 금지 — 무료 플랜 메모리(512MB) 초과로 재시작 루프 발생
      - key: PRELOAD_MODELS
        value: "0"
      - key: ORT_DISABLE_GPU_DEVICE_ENUMERATION
        value: "1"
      # Add these in Render Dashboard > Environment
      # - key: AZURE_OPENAI_API_KEY
      # - key: AZURE_OPENAI_ENDPOINT
      # - key: AZURE_OPENAI_DEPLOYMENT
      # - key: AZURE_OPENAI_API_VERSION
      # - key: TAVILY_API_KEY
      # - key: LANGSMITH_API_KEY
