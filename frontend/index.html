async function reconnectToSession(sessionId, query) {
    // status 확인 먼저 — 유효하지 않은 세션 재연결 방지
    try {
        const statusResp = await fetch(`api/status/${sessionId}`);
        const statusData = await statusResp.json();
        if (['not_found', 'stopped', 'error', 'completed'].includes(statusData.status)) {
            newAnalysis();
            return;
        }
    } catch (e) {
        showError('서버에 연결할 수 없습니다.');
        return;
    }
    currentSessionId = sessionId;
    localStorage.setItem('gapago_active_session', sessionId);
    document.getElementById('queryInput').value = query || '';
    setInputEnabled(false);
    destroyCyGraph();
    pipelineData = { refined_query: '', keywords: [], papers: [], total_searched: 0, limitations: [], limitation_eval: {}, recency_status: {}, gaps: [], report: '', analysisOptions: {} };
    _progressData = { node: '', detail: '', current: 0, total: 0, progress: 0, pipeline_progress_pct: 0, elapsed_s: 0, estimated_remaining_s: 0 };
    timelineDetails = {};
    timelineState = {};
    TIMELINE_NODES.forEach(n => { timelineState[n.id] = 'pending'; });
    _startTime = Date.now();
    clearInterval(_thinkingInterval);
    clearInterval(_elapsedInterval);
    showPipelineUI();
    const statusText = document.getElementById('statusText');
    if (statusText) statusText.textContent = '재연결 중...';
    const statusDetail = document.getElementById('statusDetail');
    if (statusDetail) statusDetail.textContent = '이전 분석을 이어서 진행합니다';
    try {
        await connectToStream(sessionId);
    } catch (e) {
        showError(e.message);
    }
}

async function connectToStream(sessionId, fromIdx, retries = 1) {
    const url = fromIdx ? `api/stream/${sessionId}?from_idx=${fromIdx}` : `api/stream/${sessionId}`;
    for (let attempt = 0; attempt < retries; attempt++) {
        const resp = await fetch(url);
        if (resp.ok) {
            await processStream(resp);
            return;
        }
        if (resp.status === 404 && attempt < retries - 1) {
            console.warn(`Stream 404, retrying (${attempt + 1}/${retries})...`);
            await new Promise(r => setTimeout(r, 500 * (attempt + 1)));
            continue;
        }
        showError(`스트림 오류 (${resp.status}): ${await resp.text()}`);
        setInputEnabled(true);
        return;
    }
}

function showError(message) {
    clearInterval(_thinkingInterval);
    clearInterval(_elapsedInterval);
    const results = document.getElementById('results');
    results.innerHTML += `
        <div class="error-banner">
            <div class="msg">${esc(message)}</div>
            <button onclick="newAnalysis()">다시 시도</button>
        </div>`;
}

async function processStream(resp) {
    const reader = resp.body.getReader();
    _activeReader = reader;
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop() || '';
        for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            try { handleEvent(JSON.parse(line.slice(6))); } catch (e) { console.warn(e); }
        }
    }
}

function findTimelineStep(nodeName) {
    for (const tl of TIMELINE_NODES) {
        if (tl.nodes.includes(nodeName)) return tl.id;
    }
    return null;
}

function handleEvent(data) {
    if (data.event === 'keepalive') return;

    if (data.event === 'progress' || data.event === 'partial_limitations' || data.event === 'partial_papers') {
        _progressData = {
            node: data.node || '', detail: data.detail || '',
            current: data.current || 0, total: data.total || 0, progress: data.progress || 0,
            pipeline_progress_pct: data.pipeline_progress_pct || _progressData.pipeline_progress_pct || 0,
            elapsed_s: data.elapsed_s || _progressData.elapsed_s || 0,
            estimated_remaining_s: data.estimated_remaining_s || _progressData.estimated_remaining_s || 0,
        };
        // Handle partial results streaming
        if (data.event === 'partial_limitations' && data.data) {
            if (!pipelineData.limitations) pipelineData.limitations = [];
            const existing = new Set(pipelineData.limitations.map(l => l.claim || l.text || ''));
            (data.data || []).forEach(l => {
                const key = l.claim || l.text || '';
                if (!existing.has(key)) { pipelineData.limitations.push(l); existing.add(key); }
            });
        }
        if (data.event === 'partial_papers' && data.data) {
            if (!pipelineData.papers) pipelineData.papers = [];
            const existingIds = new Set(pipelineData.papers.map(p => p.paper_id));
            (data.data || []).forEach(p => {
                if (!existingIds.has(p.paper_id)) { pipelineData.papers.push(p); existingIds.add(p.paper_id); }
            });
        }
        // Update timeline detail for this node
        const tlStep = findTimelineStep(data.node);
        if (tlStep) {
            timelineDetails[tlStep] = data.detail;
            const detailEl = document.getElementById(`tl-detail-${tlStep}`);
            if (detailEl) detailEl.innerHTML = esc(data.detail);
        }
        updateLivePreview();
        return;
    }

    if (data.event === 'node') {
        // Reset progress data on stage transition
        _progressData = { node: '', detail: '', current: 0, total: 0, progress: 0, pipeline_progress_pct: 0, elapsed_s: 0, estimated_remaining_s: 0 };
        const tlStepId = findTimelineStep(data.node);
        if (tlStepId) updateTimeline(tlStepId, data.node);
        collectData(data);
    } else if (data.event === 'interrupt') {
        currentSessionId = data.session_id;
        showInterrupt(data.clarify_prompt);
    } else if (data.event === 'complete') {
        clearInterval(_thinkingInterval);
        clearInterval(_elapsedInterval);
        localStorage.removeItem('gapago_active_session');
        _activeReader = null;
        // Mark all timeline steps as done
        TIMELINE_NODES.forEach(n => {
            timelineState[n.id] = 'done';
        });
        renderTimelineState();
        // Fade out pipeline UI, then show results with fade in
        const results = document.getElementById('results');
        results.classList.add('fade-out');
        setTimeout(() => {
            const totalSecs = _startTime ? Math.floor((Date.now() - _startTime) / 1000) : 0;
            const tm = Math.floor(totalSecs / 60), ts = totalSecs % 60;
            const completionInfo = `<div style="text-align:center;padding:12px 0 8px;"><span style="color:var(--accent);font-weight:600;font-size:1em;">분석 완료</span><span style="color:var(--text-light);font-size:0.82em;margin-left:10px;">${tm > 0 ? tm + '분 ' : ''}${ts}초 소요</span></div>`;
            results.innerHTML = completionInfo + '<div id="resultArea" style="display:none"></div><div id="chatContainer"></div>';
            renderResults();
            results.classList.remove('fade-out');
            results.classList.add('fade-in');
            setInputEnabled(true);
            switchToChatMode(currentSessionId, data.filename || '');
            loadHistory();
        }, 300);
    } else if (data.event === 'stopped') {
        clearInterval(_thinkingInterval);
        clearInterval(_elapsedInterval);
        localStorage.removeItem('gapago_active_session');
        _activeReader = null;
        const stoppedText = document.getElementById('statusText');
        if (stoppedText) { stoppedText.style.color = 'var(--red)'; stoppedText.textContent = '분석이 중지되었습니다'; }
        const stoppedDetail = document.getElementById('statusDetail');
        if (stoppedDetail) stoppedDetail.textContent = '';
        setInputEnabled(true);
    } else if (data.event === 'session_ended') {
        newAnalysis();
    } else if (data.event === 'error') {
        clearInterval(_thinkingInterval);
        clearInterval(_elapsedInterval);
        localStorage.removeItem('gapago_active_session');
        _activeReader = null;
        showError(data.message);
        setInputEnabled(true);
    }
}

function updateTimeline(activeStepId, nodeName) {
    // Mark all steps before the active one as done, the active one as active
    let foundActive = false;
    for (let i = TIMELINE_NODES.length - 1; i >= 0; i--) {
        if (TIMELINE_NODES[i].id === activeStepId) { foundActive = true; break; }
    }

    if (!foundActive) return;

    let reachedActive = false;
    for (const tl of TIMELINE_NODES) {
        if (tl.id === activeStepId) {
            timelineState[tl.id] = 'active';
            reachedActive = true;
        } else if (!reachedActive) {
            timelineState[tl.id] = 'done';
        }
        // leave others as they are (pending or done)
    }

    renderTimelineState();

    // Update status bar
    const statusText = document.getElementById('statusText');
    const statusDetailEl = document.getElementById('statusDetail');
    const activeNode = TIMELINE_NODES.find(n => n.id === activeStepId);
    if (statusText && activeNode) {
        statusText.style.color = '';
        statusText.textContent = activeNode.label + '...';
    }
    if (statusDetailEl) {
        statusDetailEl.textContent = THINKING_MESSAGES[Math.floor(Math.random() * THINKING_MESSAGES.length)];
    }

    // Thinking messages rotation
    clearInterval(_thinkingInterval);
    _thinkingInterval = setInterval(() => {
        const el = document.getElementById('statusDetail');
        if (el) el.textContent = THINKING_MESSAGES[Math.floor(Math.random() * THINKING_MESSAGES.length)];
    }, 8000);
}

function renderTimelineState() {
    TIMELINE_NODES.forEach(tl => {
        const el = document.getElementById(`tl-${tl.id}`);
        const iconEl = document.getElementById(`tl-icon-${tl.id}`);
        const detailEl = document.getElementById(`tl-detail-${tl.id}`);
        if (!el) return;

        const state = timelineState[tl.id] || 'pending';
        el.className = 'timeline-item ' + state;

        if (state === 'done') {
            iconEl.innerHTML = '&#x2713;';
        } else if (state === 'active') {
            iconEl.innerHTML = '&#x25C9;';
        } else {
            iconEl.innerHTML = '&#x25CB;';
        }

        if (detailEl) {
            detailEl.innerHTML = timelineDetails[tl.id] || '';
        }
    });
}

function collectData(data) {
    const node = data.node;

    if ((node === 'query_subgraph' || node === 'meaning_expand')) {
        if (data.refined_query) pipelineData.refined_query = data.refined_query;
        if (data.keywords) pipelineData.keywords = data.keywords;
        // Build detail text (질문은 우측 패널에 표시하므로 키워드만)
        let detail = '';
        if (pipelineData.keywords && pipelineData.keywords.length) {
            detail = pipelineData.keywords.slice(0, 6).map(k => `<span class="keyword-tag">${esc(k)}</span>`).join(' ');
        }
        timelineDetails['query'] = detail;
    }

    if (node === 'paper_retrieval') {
        if (data.papers) pipelineData.papers = data.papers;
        if (data.total_searched) pipelineData.total_searched = data.total_searched;
        const totalS = pipelineData.total_searched || pipelineData.papers.length || '?';
        const count = pipelineData.papers.length;
        let detail = `${totalS}편 중 ${count}편 선별`;
        timelineDetails['retrieval'] = detail;
    }

    if (node === 'limitation_extract') {
        if (data.limitations) pipelineData.limitations = data.limitations;
        const count = Array.isArray(pipelineData.limitations) ? pipelineData.limitations.length : 0;
        timelineDetails['limitation'] = `${count}개 한계점 추출`;
    }

    if (node === 'limitation_eval') {
        if (data.limitation_eval) pipelineData.limitation_eval = data.limitation_eval;
        // Try to show pass count
        const evalData = pipelineData.limitation_eval;
        if (evalData && evalData.passed_count !== undefined) {
            timelineDetails['eval'] = `${evalData.passed_count}개 통과`;
        } else if (evalData && evalData.decision) {
            timelineDetails['eval'] = esc(evalData.decision);
        } else {
            timelineDetails['eval'] = '품질 평가 완료';
        }
    }

    if (node === 'recency_check') {
        if (data.recency_status) pipelineData.recency_status = data.recency_status;
        const rs = pipelineData.recency_status;
        if (rs && (rs.unresolved !== undefined || rs.partial !== undefined || rs.resolved !== undefined)) {
            timelineDetails['recency'] = `미해결 ${rs.unresolved || 0} / 부분 ${rs.partial || 0} / 해결 ${rs.resolved || 0}`;
        } else {
            timelineDetails['recency'] = '최신성 검증 완료';
        }
    }

    if (node === 'gap_infer') {
        if (data.gaps) pipelineData.gaps = data.gaps;
        timelineDetails['gap'] = `${pipelineData.gaps.length}개 연구 GAP 도출`;
    }

    if (node === 'critic_score') {
        if (data.decision === 'ACCEPT' || (data.critic && data.critic.decision === 'ACCEPT')) {
            timelineDetails['critic'] = '품질 검증 통과';
        } else {
            timelineDetails['critic'] = '재검토 중...';
        }
    }

    if (node === 'final_response') {
        if (data.report) pipelineData.report = data.report;
        timelineDetails['report'] = '리포트 작성 완료';
    }

    // Update timeline detail display
    const tlStepId = findTimelineStep(node);
    if (tlStepId) {
        const detailEl = document.getElementById(`tl-detail-${tlStepId}`);
        if (detailEl) detailEl.innerHTML = timelineDetails[tlStepId] || '';
    }

    updateLivePreview();
}

function updateLivePreview() {
    const panel = document.getElementById('livePreview');
    if (!panel) return;

    const hasQuery = pipelineData.refined_query || (pipelineData.keywords && pipelineData.keywords.length);
    const hasPapers = pipelineData.papers.length > 0;
    const hasLimitations = pipelineData.limitations && pipelineData.limitations.length > 0;
    const hasGaps = pipelineData.gaps && pipelineData.gaps.length > 0;
    const isLimitationStage = _progressData.node === 'limitation_extract';
    const hasProgress = _progressData.total > 0 && isLimitationStage;

    if (!hasQuery && !hasPapers && !hasLimitations && !hasGaps && !hasProgress) return;

    // Show preview panel and remove center-timeline when data arrives
    if (!panel.classList.contains('has-data')) {
        panel.classList.add('has-data');
        const body = document.getElementById('analysisBody');
        if (body) body.classList.remove('center-timeline');
    }

    // Incremental limitation claim streaming
    if (hasLimitations && !hasGaps) {
        const limCount = pipelineData.limitations.length;
        const limInProgress = hasProgress && _progressData.progress < 100;
        const titleSuffix = limInProgress ? ` (추출 중... ${_progressData.current}/${_progressData.total})` : '';
        const existingStream = panel.querySelector('.lim-claim-stream');
        if (existingStream) {
            // Update title
            const titleEl = panel.querySelector('.lim-claim-title');
            if (titleEl) titleEl.textContent = `한계점 추출 (${limCount}개)${titleSuffix}`;
            // Append only new items
            const existingCount = existingStream.children.length;
            if (existingCount < limCount) {
                for (let i = existingCount; i < limCount; i++) {
                    const lim = pipelineData.limitations[i];
                    const claim = lim.claim || lim.limitation_text || lim.text || lim.content || '(한계점)';
                    const item = document.createElement('div');
                    item.className = 'lim-claim-item';
                    item.textContent = claim;
                    existingStream.appendChild(item);
                }
                existingStream.scrollTop = existingStream.scrollHeight;
            }
            return;
        }
    }

    let html = '';

    // GAPs
    if (hasGaps) {
        html += `<div class="preview-section"><div class="preview-section-title">연구 GAP (${pipelineData.gaps.length})</div>`;
        pipelineData.gaps.forEach(gap => {
            const axisLabel = gap.axis_label || gap.axis || '';
            const ac = getAxisColor(axisLabel);
            html += `<div class="preview-gap-card" style="border-left:3px solid ${ac.border}">
                <div class="preview-gap-axis"><span class="axis-badge" style="background:${ac.bg};color:${ac.color}">${esc(axisLabel)}</span></div>
                <div class="preview-gap-statement">${esc(gap.gap_statement || '')}</div>
            </div>`;
        });
        html += '</div>';
    }

    // Limitations — claim 스트리밍
    if (hasLimitations && !hasGaps) {
        const limCount = pipelineData.limitations.length;
        const limInProgress = hasProgress && _progressData.progress < 100;
        const titleSuffix = limInProgress ? ` (추출 중... ${_progressData.current}/${_progressData.total})` : '';
        html += `<div class="preview-section"><div class="preview-section-title lim-claim-title">한계점 추출 (${limCount}개)${titleSuffix}</div>`;
        html += `<div class="lim-claim-stream">`;
        pipelineData.limitations.forEach(lim => {
            const claim = lim.claim || lim.limitation_text || lim.text || lim.content || '(한계점)';
            html += `<div class="lim-claim-item">${esc(claim)}</div>`;
        });
        html += '</div></div>';
    }

    // Papers
    if (hasPapers) {
        html += `<div class="preview-section"><div class="preview-section-title">검색된 논문 (${pipelineData.papers.length}/${pipelineData.total_searched || pipelineData.papers.length || '?'})</div>`;
        html += `<div style="max-height:300px;overflow-y:auto;">`;
        pipelineData.papers.forEach(p => {
            html += `<div class="preview-paper-item">
                <div class="preview-paper-title">${esc(p.title || '')}</div>
                <div class="preview-paper-meta">${p.year || ''} ${p.venue ? '· ' + esc(p.venue) : ''}</div>
            </div>`;
        });
        html += '</div></div>';
    }

    // Query & Keywords (show at bottom as context)
    if (hasQuery) {
        html += `<div class="preview-section">`;
        if (pipelineData.refined_query) {
            html += `<div class="preview-query-box">
                <div class="preview-query-label">정제된 질문</div>
                <div class="preview-query-text">${esc(pipelineData.refined_query)}</div>
            </div>`;
        }
        if (pipelineData.keywords && pipelineData.keywords.length) {
            html += `<div class="preview-query-box">
                <div class="preview-query-label">확장 키워드</div>
                <div class="preview-keywords">${pipelineData.keywords.map(k => `<span class="preview-keyword-tag">${esc(k)}</span>`).join('')}</div>
            </div>`;
        }
        html += '</div>';
    }

    panel.innerHTML = html;
}

// ── 관계도 그래프 (Cytoscape) ──

function buildCyGraphData() {
    const papers = pipelineData.papers || [];
    const limitations = pipelineData.limitations || [];
    const gaps = pipelineData.gaps || [];
    const paperIds = new Set(papers.map(p => p.paper_id));

    // 유효한 limitation만 (paper가 존재)
    const validLimitations = limitations
        .map((l, i) => ({ ...l, _idx: i }))
        .filter(l => paperIds.has(l.paper_id));

    // paper → limitation 엣지
    const paperToLim = [];
    validLimitations.forEach(l => {
        paperToLim.push({ from: l.paper_id, to: `lim-${l._idx}` });
    });

    // limitation → gap 엣지 (supporting_papers 매칭)
    const limToGap = [];
    const limToGapSet = new Set();
    gaps.forEach((gap, gi) => {
        (gap.supporting_papers || []).forEach(pid => {
            validLimitations.filter(l => l.paper_id === pid).forEach(l => {
                const key = `lim-${l._idx}->gap-${gi}`;
                if (!limToGapSet.has(key)) {
                    limToGapSet.add(key);
                    limToGap.push({ from: `lim-${l._idx}`, to: `gap-${gi}` });
                }
            });
        });
    });

    return { papers, validLimitations, gaps, paperToLim, limToGap };
}

function buildCyElements() {
    const data = buildCyGraphData();
    const { papers, validLimitations, gaps, paperToLim, limToGap } = data;
    const elements = [];

    if (!papers.length && !gaps.length) return elements;

    // 한계점 그룹핑 (60개 초과 시 논문별 그룹)
    const groupLimitations = validLimitations.length > 60;

    // 논문 노드
    papers.forEach((p, i) => {
        const fullTitle = p.title || p.paper_id || '';
        const title = truncate(fullTitle, 28);
        const meta = [p.venue, p.year].filter(Boolean).join(', ');
        elements.push({ data: { id: p.paper_id, label: title, fullLabel: fullTitle, meta, nodeType: 'paper', index: i } });
    });

    // 한계점 노드
    if (groupLimitations) {
        const byPaper = {};
        validLimitations.forEach(l => {
            if (!byPaper[l.paper_id]) byPaper[l.paper_id] = [];
            byPaper[l.paper_id].push(l);
        });
        Object.entries(byPaper).forEach(([pid, lims]) => {
            const paper = papers.find(p => p.paper_id === pid);
            const label = (paper ? truncate(paper.title || '', 18) : pid.slice(0, 12)) + ` (${lims.length})`;
            const grpId = `limgrp-${pid}`;
            elements.push({ data: { id: grpId, label, nodeType: 'lim', paperId: pid } });
            // paper → limgroup edge
            elements.push({ data: { source: pid, target: grpId, edgeType: 'paper-lim' } });
            // limgroup → gap edges
            const gapTargets = new Set();
            lims.forEach(l => {
                limToGap.filter(e => e.from === `lim-${l._idx}`).forEach(e => gapTargets.add(e.to));
            });
            gapTargets.forEach(gid => {
                elements.push({ data: { source: grpId, target: gid, edgeType: 'lim-gap' } });
            });
        });
    } else {
        validLimitations.forEach(l => {
            const fullClaim = l.claim || l.limitation_text || l.text || l.content || '(한계점)';
            const claim = truncate(fullClaim, 32);
            elements.push({ data: { id: `lim-${l._idx}`, label: claim, fullLabel: fullClaim, nodeType: 'lim', paperId: l.paper_id } });
        });
        // paper → lim edges
        paperToLim.forEach(e => {
            elements.push({ data: { source: e.from, target: e.to, edgeType: 'paper-lim' } });
        });
        // lim → gap edges
        limToGap.forEach(e => {
            elements.push({ data: { source: e.from, target: e.to, edgeType: 'lim-gap' } });
        });
    }

    // GAP 노드 (크기 = 연결된 엣지 수에 비례)
    const gapEdgeCounts = {};
    elements.filter(e => e.data.edgeType === 'lim-gap').forEach(e => {
        gapEdgeCounts[e.data.target] = (gapEdgeCounts[e.data.target] || 0) + 1;
    });
    gaps.forEach((g, i) => {
        const axisLabel = g.axis_label || g.axis || '';
        const ac = getAxisColor(axisLabel);
        const stmt = g.gap_statement || '';
        const limCount = edges.filter(e => e.to === `gap-${i}`).length;
        return `<div class="flow-node flow-node-gap" data-id="gap-${i}" data-idx="${i}" style="background:${ac.bg};border-color:${ac.border}">
            <div class="flow-node-axis" style="color:${ac.color}">${esc(axisLabel)}</div>
            <div class="flow-node-statement">${esc(stmt)}</div>
            ${limCount ? `<div class="flow-node-count"><span style="color:${ac.color}">&#9679;</span> ${limCount} papers</div>` : ''}
        </div>`;
    }).join('');

    // Draw SVG edges
    function drawEdges() {
        const cRect = container.getBoundingClientRect();
        svg.setAttribute('viewBox', `0 0 ${cRect.width} ${cRect.height}`);
        svg.innerHTML = '';

        const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
        // 클리핑 영역: SVG 선이 container 밖으로 삐져나가지 않도록 제한
        const clipPath = document.createElementNS('http://www.w3.org/2000/svg', 'clipPath');
        clipPath.id = 'flowClip';
        const clipRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        clipRect.setAttribute('x', '0'); clipRect.setAttribute('y', '0');
        clipRect.setAttribute('width', cRect.width); clipRect.setAttribute('height', cRect.height);
        clipPath.appendChild(clipRect);
        defs.appendChild(clipPath);
        ['PL','LG','HL'].forEach((k, i) => {
            const colors = [
                [EDGE_COLORS.paperToLim.start, EDGE_COLORS.paperToLim.end],
                [EDGE_COLORS.limToGap.start, EDGE_COLORS.limToGap.end],
                ['#4f6ef7', '#a78bfa'],
            ];
            const grad = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
            grad.id = `edgeGrad${k}`; grad.setAttribute('x1','0%'); grad.setAttribute('x2','100%');
            grad.innerHTML = `<stop offset="0%" stop-color="${colors[i][0]}"/><stop offset="100%" stop-color="${colors[i][1]}"/>`;
            defs.appendChild(grad);
        });
        svg.appendChild(defs);
        // 모든 엣지를 클리핑 그룹 안에 그리기
        const edgeGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        edgeGroup.setAttribute('clip-path', 'url(#flowClip)');

        edges.forEach(e => {
            const fromEl = container.querySelector(`[data-id="${e.from}"]`);
            const toEl = container.querySelector(`[data-id="${e.to}"]`);
            if (!fromEl || !toEl) return;
            const fr = fromEl.getBoundingClientRect();
            const tr = toEl.getBoundingClientRect();
            if (fr.bottom < cRect.top || fr.top > cRect.bottom) return;
            if (tr.bottom < cRect.top || tr.top > cRect.bottom) return;

            const x1 = fr.right - cRect.left, y1 = (fr.top + fr.bottom) / 2 - cRect.top;
            const x2 = tr.left - cRect.left,  y2 = (tr.top + tr.bottom) / 2 - cRect.top;
            const dx = Math.abs(x2 - x1) * 0.45;

            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', `M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`);
            path.setAttribute('class', 'flow-edge');
            path.setAttribute('stroke', `url(#${e.grad})`);
            path.setAttribute('data-from', e.from);
            path.setAttribute('data-to', e.to);
            path.setAttribute('data-grad', e.grad);
            edgeGroup.appendChild(path);
        });
        svg.appendChild(edgeGroup);
    }

    function expandLim(limNode) {
        const limId = limNode.id();
        if (expandedLims.has(limId)) return;
        expandedLims.add(limId);
        // 연결된 Paper 노드 + paper-lim 엣지 표시
        const incomingEdges = limNode.incomers('edge[edgeType="paper-lim"]');
        const paperNodes = incomingEdges.sources();
        paperNodes.removeClass('cy-collapsed');
        incomingEdges.removeClass('cy-collapsed');
    }

    function collapseGap(gapNode) {
        const gapId = gapNode.id();
        if (!expandedGaps.has(gapId)) return;
        expandedGaps.delete(gapId);
        gapNode.data('label', gapNode.data('badgeLabel'));
        // 연결된 Lim 숨김 (다른 GAP에 연결되지 않은 것만)
        const incomingEdges = gapNode.incomers('edge[edgeType="lim-gap"]');
        const limNodes = incomingEdges.sources();
        incomingEdges.addClass('cy-collapsed');
        limNodes.forEach(lim => {
            const otherGapEdges = lim.outgoers('edge[edgeType="lim-gap"]').filter(e => expandedGaps.has(e.target().id()));
            if (otherGapEdges.length === 0) {
                collapseLim(lim);
                lim.addClass('cy-collapsed');
            }
        });
    }

    function collapseLim(limNode) {
        const limId = limNode.id();
        expandedLims.delete(limId);
        const incomingEdges = limNode.incomers('edge[edgeType="paper-lim"]');
        const paperNodes = incomingEdges.sources();
        incomingEdges.addClass('cy-collapsed');
        paperNodes.forEach(p => {
            const otherLimEdges = p.outgoers('edge[edgeType="paper-lim"]').filter(e => !e.target().hasClass('cy-collapsed'));
            if (otherLimEdges.length === 0) p.addClass('cy-collapsed');
        });
    }

    function highlightNeighborhood(node) {
        const nodeType = node.data('nodeType');
        let connected;
        if (nodeType === 'paper') {
            const hop1 = node.outgoers();
            const hop2 = hop1.nodes().outgoers();
            connected = node.union(hop1).union(hop2);
        } else if (nodeType === 'gap') {
            const hop1 = node.incomers();
            const hop2 = hop1.nodes().incomers();
            connected = node.union(hop1).union(hop2);
        } else {
            connected = node.closedNeighborhood();
        }
        // 보이는 요소 중에서만 dim
        const visible = cy.elements().filter(e => !e.hasClass('cy-collapsed'));
        visible.addClass('dimmed');
        connected.filter(e => !e.hasClass('cy-collapsed')).removeClass('dimmed').addClass('highlighted');
    }

    function clearHighlight() {
        cy.elements().removeClass('highlighted dimmed');
    }

    cy.on('mouseover', 'node', function(e) {
        if (lockedNode) return;
        highlightNeighborhood(e.target);
        const fullLabel = e.target.data('fullLabel');
        if (fullLabel) cy.container().setAttribute('title', fullLabel);
    });

    cy.on('mouseout', 'node', function() {
        if (lockedNode) return;
        clearHighlight();
        cy.container().removeAttribute('title');
    });

    cy.on('tap', 'node', function(e) {
        const node = e.target;
        const nodeType = node.data('nodeType');
        const index = node.data('index');

        // Toggle lock
        if (lockedNode && lockedNode.id() === node.id()) {
            lockedNode = null;
            clearHighlight();
            return;
        }

        lockedNode = node;
        clearHighlight();
        highlightNeighborhood(node);

        // Collapse/Expand + detail panel
        if (nodeType === 'gap') {
            if (expandedGaps.has(node.id())) {
                collapseGap(node);
            } else {
                expandGap(node);
            }
            if (index !== undefined) selectGap(index);
        } else if (nodeType === 'lim') {
            if (expandedLims.has(node.id())) {
                collapseLim(node);
            } else {
                expandLim(node);
            }
            const paperId = node.data('paperId');
            const pIdx = (pipelineData.papers || []).findIndex(p => p.paper_id === paperId);
            if (pIdx >= 0) selectPaper(pIdx);
        } else if (nodeType === 'paper' && index !== undefined) {
            selectPaper(index);
        }
    });

    cy.on('tap', function(e) {
        if (e.target === cy) {
            lockedNode = null;
            clearHighlight();
        }
    });

    // ── 더블클릭 줌인 ──
    cy.on('dbltap', 'node', function(e) {
        const node = e.target;
        const neighborhood = node.closedNeighborhood();
        cy.animate({ fit: { eles: neighborhood, padding: 50 }, duration: 400 });
    });

    // ── Semantic zoom (3단계) ──
    const ZOOM_DOT = 0.4;
    const ZOOM_MID = 0.8;
    let currentZoomMode = 'card';
    let _zoomTimer = null;
    cy.on('zoom', function() {
        clearTimeout(_zoomTimer);
        _zoomTimer = setTimeout(function() {
            const z = cy.zoom();
            let mode;
            if (z < ZOOM_DOT) mode = 'dot';
            else if (z < ZOOM_MID) mode = 'mid';
            else mode = 'card';
            if (mode === currentZoomMode) return;
            // 이전 모드 클래스 제거
            cy.elements().removeClass('zoom-dot zoom-mid');
            if (mode === 'dot') {
                cy.elements().addClass('zoom-dot');
            } else if (mode === 'mid') {
                cy.elements().addClass('zoom-mid');
            }
            currentZoomMode = mode;
        }, 50);
    });

    // ── 초기 collapse + 진입 애니메이션 ──
    cy.one('layoutstop', function() {
        // 모든 요소 숨김
        cy.elements().style('opacity', 0);
        collapseAll();

        // 1단계: GAP 노드 fade-in (0~400ms)
        const gapNodes = cy.nodes('[nodeType="gap"]');
        gapNodes.removeClass('cy-collapsed');
        gapNodes.forEach((n, i) => {
            setTimeout(() => {
                n.animate({ style: { opacity: 1 } }, { duration: 400 });
            }, i * 80);
        });

        // 2단계: lim-gap 엣지 라인 (400ms~)
        const limGapEdges = cy.edges('[edgeType="lim-gap"]');
        setTimeout(() => {
            limGapEdges.forEach(e => {
                e.animate({ style: { opacity: 0.6 } }, { duration: 350 });
            });
        }, gapNodes.length * 80 + 200);

        // collapsed 된 노드들은 opacity 초기화 (display:none이므로 안 보임)
        setTimeout(() => {
            cy.nodes('.cy-collapsed').style('opacity', 1);
            cy.edges('.cy-collapsed').style('opacity', 1);
        }, gapNodes.length * 80 + 600);
    });
}

function destroyCyGraph() {
    if (window._cyInstance) {
        window._cyInstance.destroy();
        window._cyInstance = null;
    }
}


function renderResults() {
    destroyCyGraph();
    const area = document.getElementById('resultArea');
    area.style.display = 'block';

    selectedItem = { type: 'gap', index: 0 };

    // Summary stats (used in report toggle)
    const totalSearched = pipelineData.total_searched || pipelineData.papers.length || '?';
    const papersCount = pipelineData.papers.length;
    const gapsCount = pipelineData.gaps.length;

    // Left panel: gaps + papers
    let leftHTML = '';

    // Gaps section
    leftHTML += `<div class="panel-section-header">연구 GAP (${gapsCount})</div>`;

    if (pipelineData.gaps.length) {
        pipelineData.gaps.forEach((gap, i) => {
            const isTop = i === 0;
            const activeClass = (selectedItem.type === 'gap' && selectedItem.index === i) ? ' active' : '';
            const axisLabel = gap.axis_label || gap.axis || '';
            const ac = getAxisColor(axisLabel);

                            <span><span class="cy-legend-dot" style="background:#fffbeb;border:1px solid #f59e0b"></span> 한계점</span>

function getGapDetailHTML(index) {
    if (!pipelineData.gaps.length || index >= pipelineData.gaps.length) {
        return '<div style="padding:20px;color:var(--text-light);text-align:center">GAP을 선택하세요</div>';
    }
    const gap = pipelineData.gaps[index];
    const axisLabel = gap.axis_label || gap.axis || '';
    const ac = getAxisColor(axisLabel);

    let html = '';
    html += `<div class="detail-gap-axis"><span class="axis-badge" style="background:${ac.bg};color:${ac.color};font-size:0.82em;padding:3px 10px">${esc(axisLabel)}</span> <span style="margin-left:6px">${gap.repeat_count || 0}편 논문에서 도출</span></div>`;
    html += `<div class="detail-gap-statement">${esc(gap.gap_statement || '')}</div>`;
    html += `<div class="detail-gap-elaboration">${esc(gap.elaboration || '')}</div>`;

    // Supporting papers
    if (gap.supporting_papers && gap.supporting_papers.length) {
        html += `<div class="detail-section-title">근거 논문</div>`;
        html += '<div>';
        gap.supporting_papers.slice(0, 8).forEach(pid => {
            const idx = pipelineData.papers.findIndex(p => p.paper_id === pid);
            const title = idx !== -1 ? pipelineData.papers[idx].title : pid;
            html += `<span class="supporting-paper-chip" onclick="selectPaper(${idx !== -1 ? idx : 0})" title="${esc(title)}">${esc(truncate(title, 40))}</span>`;
        });
        html += '</div>';
    }

    // Supporting quotes
    if (gap.supporting_quotes && gap.supporting_quotes.length) {
        html += `<div class="detail-section-title">근거 인용</div>`;
        gap.supporting_quotes.slice(0, 4).forEach(q => {
            html += `<div class="supporting-quote">${esc(q)}</div>`;
        });
    }

    // Proposed topic
    if (gap.proposed_topic) {
        html += `<div class="proposed-topic-box">
            <div class="topic-label">제안 연구 방향</div>
            <div class="topic-text">${esc(gap.proposed_topic)}</div>
        </div>`;
        html += `<button class="explore-btn" onclick="exploreDirection('${esc(gap.proposed_topic).replace(/'/g, "\\'")}')">이 방향으로 추가 탐색 &#x2192;</button>`;
    }

    return html;
}

function getPaperDetailHTML(index) {
    if (!pipelineData.papers.length || index >= pipelineData.papers.length) {
        return '<div style="padding:20px;color:var(--text-light);text-align:center">논문을 선택하세요</div>';
    }
    const p = pipelineData.papers[index];

    let html = '';
    html += `<div class="paper-detail-title">${esc(p.title || '')}</div>`;

    let metaParts = [];
    if (p.authors && p.authors.length) metaParts.push(p.authors.slice(0, 5).join(', '));
    if (p.year) metaParts.push(p.year);
    if (p.venue) metaParts.push(`<span class="venue-badge">${esc(p.venue)}</span>`);
    html += `<div class="paper-detail-meta">${metaParts.join(' &middot; ')}</div>`;

    if (p.url) {
        html += `<a class="paper-detail-link" href="${esc(p.url)}" target="_blank" rel="noopener">논문 원문 보기 &#x2197;</a>`;
    }

    if (p.abstract) {
        html += `<div class="detail-section-title">초록</div>`;
        html += `<div class="paper-detail-abstract">${esc(p.abstract)}</div>`;
    }

    // Limitations from this paper
    if (pipelineData.limitations && pipelineData.limitations.length) {
        const paperLimitations = pipelineData.limitations.filter(l => l.paper_id === p.paper_id);
        if (paperLimitations.length) {
            html += `<div class="detail-section-title">이 논문의 한계점 (${paperLimitations.length})</div>`;
            paperLimitations.forEach((l, idx) => {
                const claim = l.claim || l.limitation_text || l.text || l.content || '';
                const quote = l.evidence_quote || '';
                html += `<div class="paper-lim-card">
                    <div class="paper-lim-claim">${esc(claim)}</div>
                    ${quote ? `<div class="paper-lim-quote">"${esc(truncate(quote, 200))}"</div>` : ''}
                </div>`;
            });
        }
    }

    return html;
}

function selectGap(index) {
    selectedItem = { type: 'gap', index };
    // Update active state in left panel
    document.querySelectorAll('.gap-item-compact').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.paper-item-compact').forEach(el => el.classList.remove('active'));
    const el = document.getElementById(`gap-item-${index}`);
    if (el) el.classList.add('active');
    // Render right panel
    const dp = document.getElementById('detailPanel');
    if (dp) dp.innerHTML = getGapDetailHTML(index);
}

function selectPaper(index) {
    if (index < 0 || index >= pipelineData.papers.length) return;
    selectedItem = { type: 'paper', index };
    // Update active state
    document.querySelectorAll('.gap-item-compact').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.paper-item-compact').forEach(el => el.classList.remove('active'));
    const el = document.getElementById(`paper-item-${index}`);
    if (el) el.classList.add('active');
    // Render right panel
    const dp = document.getElementById('detailPanel');
    if (dp) dp.innerHTML = getPaperDetailHTML(index);
}

function toggleMasterReport() {
    const mc = document.getElementById('reportMasterCollapse');
    const body = mc.querySelector('.report-master-body');
    if (mc.classList.contains('open')) {
        body.style.maxHeight = body.scrollHeight + 'px';
        requestAnimationFrame(() => { body.style.maxHeight = '0'; });
        mc.classList.remove('open');
    } else {
        mc.classList.add('open');
        body.style.maxHeight = body.scrollHeight + 'px';
        body.addEventListener('transitionend', () => {
            if (mc.classList.contains('open')) body.style.maxHeight = 'calc(100vh - 180px)';
        }, { once: true });
    }
}

async function exploreDirection(topic) {
    if (!validateOptions()) return;
    // Fill query input and start new analysis
    document.getElementById('queryInput').value = topic;

    const provider = document.getElementById('provider').value;
    const domain = 'auto';
    const yearRange = document.getElementById('yearRange').value;
    const outputLanguage = document.getElementById('outputLanguage').value;

    setInputEnabled(false);
    destroyCyGraph();
    pipelineData = { refined_query: '', keywords: [], papers: [], total_searched: 0, limitations: [], limitation_eval: {}, recency_status: {}, gaps: [], report: '', analysisOptions: {} };
    _progressData = { node: '', detail: '', current: 0, total: 0, progress: 0, pipeline_progress_pct: 0, elapsed_s: 0, estimated_remaining_s: 0 };
    timelineDetails = {};
    timelineState = {};
    TIMELINE_NODES.forEach(n => { timelineState[n.id] = 'pending'; });
    _startTime = Date.now();
    clearInterval(_thinkingInterval);
    clearInterval(_elapsedInterval);

    showPipelineUI();

    try {
        // Try /api/explore first, fallback to /api/analyze
        let resp;
        try {
            const exploreParams = new URLSearchParams({ session_id: currentSessionId || '', topic, provider, domain, year_range: yearRange, output_language: outputLanguage, user_id: USER_ID });
            resp = await fetch(`api/explore?${exploreParams}`);
            if (!resp.ok) throw new Error('explore not available');
        } catch (e) {
            const fastMode2 = document.getElementById('fastMode')?.checked || false;
            const params = new URLSearchParams({ query: topic, provider, domain, year_range: yearRange, output_language: outputLanguage, user_id: USER_ID, ...(fastMode2 ? {fast_mode: 'true'} : {}) });
            resp = await fetch(`api/analyze?${params}`);
        }

        if (!resp.ok) {
            showError(`API 오류 (${resp.status}): ${await resp.text()}`);
            setInputEnabled(true);
            return;
        }
        const { session_id } = await resp.json();
        currentSessionId = session_id;
        localStorage.setItem('gapago_active_session', session_id);
        loadHistory();

        await connectToStream(session_id);
    } catch (e) {
        showError(e.message);
    }
}

function showInterrupt(prompt) {
    const results = document.getElementById('results');
    const statusText = document.getElementById('statusText');
    if (statusText) { statusText.style.color = 'var(--yellow)'; statusText.textContent = '입력을 기다리고 있습니다...'; }
    const statusDetail = document.getElementById('statusDetail');
    if (statusDetail) statusDetail.textContent = '';
    const div = document.createElement('div');
    div.className = 'interrupt-card';
    div.id = 'interruptCard';
    const formatted = prompt ? esc(prompt).replace(/\n/g, '<br>') : '';
    div.innerHTML = `
        <h3>질의 명확화 필요</h3>
        ${formatted ? `<div class="prompt">${formatted}</div>` : ''}
        <input type="text" id="clarifyInput" placeholder="번호를 입력하거나 원하는 방향을 직접 입력하세요..." onkeydown="if(event.key==='Enter') resumePipeline()">
        <div class="interrupt-actions">
            <button class="btn-resume" onclick="resumePipeline()">계속</button>
            <button class="btn-skip" onclick="skipClarification()">건너뛰기 (현재 상태로 진행)</button>
        </div>
    `;
    results.appendChild(div);
    document.getElementById('clarifyInput').focus();
}

async function resumePipeline() {
    const input = document.getElementById('clarifyInput').value.trim();
    if (!input) return;
    await sendClarification(input);
}

async function skipClarification() { await sendClarification('proceed as is'); }

async function sendClarification(response) {
    const card = document.getElementById('interruptCard');
    if (card) card.remove();
    const statusText = document.getElementById('statusText');
    if (statusText) { statusText.style.color = ''; statusText.textContent = '분석 재개 중...'; }
    const statusDetail = document.getElementById('statusDetail');
    if (statusDetail) statusDetail.textContent = '입력을 처리하고 있습니다...';
    try {
        const params = new URLSearchParams({ session_id: currentSessionId, response });
        const resp = await fetch(`api/clarify?${params}`);
        if (!resp.ok) { showError(`명확화 오류 (${resp.status}): ${await resp.text()}`); return; }
        const data = await resp.json();
        await connectToStream(currentSessionId, data.events_count || 0);
    } catch (e) { showError(e.message); }
}

function renderMarkdown(text) {
    text = text.replace(/FINAL\s*ANSWER\s*/gi, '');
    text = text.replace(/^[─━═┄┅┈┉╌╍]+$/gm, '---');
    text = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    // Parse tables
    text = text.replace(/(^\|.+\|$\n?)+/gm, function(tableBlock) {
        const rows = tableBlock.trim().split('\n').filter(r => r.trim());
        if (rows.length < 2) return tableBlock;
        let html = '<table>';
        let headerDone = false;
        rows.forEach((row) => {
            const cells = row.split('|').filter((c, j, a) => j > 0 && j < a.length).map(c => c.trim());
            if (cells.every(c => /^[-:\s]+$/.test(c))) { headerDone = true; return; }
            const tag = !headerDone ? 'th' : 'td';
            html += '<tr>' + cells.map(c => `<${tag}>${c}</${tag}>`).join('') + '</tr>';
            if (!headerDone) headerDone = true;
        });
        html += '</table>';
        return html;
    });

    return text
        .replace(/^---$/gm, '<hr>')
        .replace(/^#### (.+)$/gm, '<h4>$1</h4>')
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        .replace(/^# (.+)$/gm, '<h1>$1</h1>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>')
        .replace(/^- (.+)$/gm, '<li>$1</li>')
        .replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>')
        .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
        .replace(/(📌)/g, '<div class="gap-break"></div>$1')
        .replace(/\n{2,}/g, '<br><br>')
        .replace(/\n/g, '<br>');
}

function buildReportMd() {
    const opts = pipelineData.analysisOptions || {};
    let md = '# 분석 리포트\n\n';

    if (opts.provider || opts.yearRange || opts.outputLanguage) {
        md += '## 분석 옵션\n';
        if (opts.provider) md += `- LLM: ${opts.provider}\n`;
        if (opts.yearRange) md += `- 연도 범위: ${opts.yearRange}\n`;
        if (opts.outputLanguage) md += `- 출력 언어: ${opts.outputLanguage}\n`;
        md += '\n';
    }

    if (pipelineData.refined_query) {
        md += `## 정제된 질문\n${pipelineData.refined_query}\n\n`;
    }

    if (pipelineData.keywords && pipelineData.keywords.length) {
        md += `## 확장 키워드\n${pipelineData.keywords.join(', ')}\n\n`;
    }

    md += `## 요약\n`;
    md += `- 검색 논문: ${pipelineData.papers.length}/${pipelineData.total_searched || pipelineData.papers.length || '?'}편\n`;
    md += `- 도출 GAP: ${pipelineData.gaps.length}개\n\n`;
    md += '---\n\n';

    if (pipelineData.report) md += pipelineData.report;
    return md;
}

function mdToHtml(md) {
    return md
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        .replace(/^# (.+)$/gm, '<h1>$1</h1>')
        .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
        .replace(/(?<!\w)_(.+?)_(?!\w)/g, '<i>$1</i>')
        .replace(/^- (.+)$/gm, '<li>$1</li>')
        .replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>')
        .replace(/(<\/ul>\s*<ul>)/g, '')
        .replace(/^---$/gm, '<hr>')
        .replace(/\n{2,}/g, '<br><br>')
        .replace(/\n/g, '<br>');
}

function downloadReport(format) {
    const md = buildReportMd();
    const now = new Date();
    const ts = now.getFullYear().toString()
        + String(now.getMonth() + 1).padStart(2, '0')
        + String(now.getDate()).padStart(2, '0')
        + '_' + String(now.getHours()).padStart(2, '0')
        + String(now.getMinutes()).padStart(2, '0')
        + String(now.getSeconds()).padStart(2, '0');

    let blob, filename;
    if (format === 'docx') {
        const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><style>body{font-family:'Malgun Gothic',sans-serif;font-size:11pt;line-height:1.6}h1{font-size:18pt}h2{font-size:14pt}h3{font-size:12pt}</style></head><body>${mdToHtml(md)}</body></html>`;
        blob = new Blob(['\ufeff' + html], { type: 'application/msword' });
        filename = `GAPAGO_report_${ts}.doc`;
    } else {
        blob = new Blob([md], { type: 'text/markdown' });
        filename = `GAPAGO_report_${ts}.md`;
    }

    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
}

function truncate(str, max) {
    if (!str) return '';
    return str.length > max ? str.slice(0, max) + '...' : str;
}

function esc(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function richText(str) {
    if (!str) return '';
    let s = esc(str);
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(?<!\w)_(.+?)_(?!\w)/g, '<em>$1</em>');
    s = s.replace(/\n/g, '<br>');
    return s;
}

}

function switchMdTab(tab) {
    document.getElementById('mdRendered').style.display = tab === 'rendered' ? 'block' : 'none';
    document.getElementById('mdRaw').style.display = tab === 'raw' ? 'block' : 'none';
    document.querySelectorAll('.md-tab').forEach(btn => btn.classList.remove('active'));
    document.getElementById('mdTab-' + tab).classList.add('active');
}

function mdToHtmlRich(md) {
    // Table of contents awareness + richer conversion
    let html = md
        .replace(/^#### (.+)$/gm, '<h4>$1</h4>')
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        .replace(/^# (.+)$/gm, '<h1>$1</h1>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/(?<!\w)_(.+?)_(?!\w)/g, '<em>$1</em>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/^---$/gm, '<hr>')
        .replace(/^- (.+)$/gm, '<li>$1</li>')
        .replace(/^(\d+)\. (.+)$/gm, '<li>$2</li>')
        // Wrap consecutive <li> in <ul>
        .replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>')
        // Paragraphs
        .split(/\n{2,}/)
        .map(block => {
            if (/^<(h[1-4]|ul|hr|li)/.test(block.trim())) return block;
            const trimmed = block.trim().replace(/\n/g, '<br>');
            return trimmed ? `<p>${trimmed}</p>` : '';
        })
        .join('\n');
    return html;
}

function copyMdToClipboard() {
    const md = buildReportMd();
    navigator.clipboard.writeText(md).then(() => {
        const btn = document.getElementById('mdCopyBtn');
        const orig = btn.textContent;
        btn.textContent = '✓ 복사됨';
        setTimeout(() => { btn.textContent = orig; }, 1800);
    });
}

// Close modal on overlay click
document.addEventListener('DOMContentLoaded', function() {
    const overlay = document.getElementById('mdViewerOverlay');
    if (overlay) {
        overlay.addEventListener('click', function(e) {
            if (e.target === overlay) closeMdViewer();
        });
    }
    // Keyboard ESC
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeMdViewer();
    });
});
</script>

            <button id="mdViewerClose" onclick="closeMdViewer()" title="닫기">✕</button>
        </div>
        <div id="mdViewerTabs">
            <button class="md-tab active" id="mdTab-rendered" onclick="switchMdTab('rendered')">렌더링 보기</button>

        </div>
    </div>
</div>
