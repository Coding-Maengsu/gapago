<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAPAGO - 연구 GAP Agent</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #f5f6fa;
            --surface: #ffffff;
            --surface2: #f0f2f8;
            --surface3: #e8eaf3;
            --border: #dfe3ed;
            --border-light: #eceef5;
            --text: #1a1f36;
            --text-dim: #5e6687;
            --text-light: #8e94ab;
            --accent: #5469d4;
            --accent-hover: #4255b8;
            --accent-light: #eef0fb;
            --accent-bg: #f6f7fe;
            --accent2: #7c5cbf;
            --green: #0fba81;
            --green-light: #eafaf4;
            --yellow: #e8920b;
            --yellow-light: #fef8ec;
            --red: #e54e4e;
            --red-light: #fef0f0;
            --shadow-sm: 0 1px 2px rgba(26,31,54,0.04);
            --shadow: 0 2px 8px rgba(26,31,54,0.06);
            --shadow-md: 0 4px 16px rgba(26,31,54,0.08);
            --radius: 10px;
            --radius-lg: 14px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Pretendard Variable', 'Pretendard', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
            font-size: 17px;
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Sidebar ── */
        .sidebar {
            width: 272px;
            background: var(--surface);
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 20px 18px;
            border-bottom: 1px solid var(--border-light);
        }

        .sidebar-header h1 {
            font-size: 1.25em;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: -0.4px;
        }

        .sidebar-header p {
            font-size: 0.8em;
            color: var(--text-light);
            margin-top: 1px;
            font-weight: 400;
        }

        .new-btn {
            margin: 14px 14px 10px;
            padding: 10px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.88em;
            font-family: inherit;
            transition: background 0.15s, box-shadow 0.15s;
            letter-spacing: 0.1px;
        }

        .new-btn:hover { background: var(--accent-hover); box-shadow: 0 2px 8px rgba(84,105,212,0.25); }

        .settings-section {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border-light);
        }

        .settings-section label {
            display: block;
            font-size: 0.75em;
            color: var(--text-light);
            margin-bottom: 3px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .settings-section select {
            width: 100%;
            padding: 8px 10px;
            background: var(--surface2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.86em;
            margin-bottom: 8px;
            font-family: inherit;
            cursor: pointer;
            outline: none;
            transition: border-color 0.15s;
        }
        .settings-section select:focus { border-color: var(--accent); }
        .settings-section select:invalid { color: var(--text-light); }
        .settings-section select.shake {
            animation: optionShake 0.45s ease;
            border-color: var(--red) !important;
            box-shadow: 0 0 0 2px var(--red-light);
        }
        @keyframes optionShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-5px); }
            40% { transform: translateX(5px); }
            60% { transform: translateX(-3px); }
            80% { transform: translateX(3px); }
        }
        .settings-section.option-highlight {
            animation: optionPulse 1.5s ease;
        }
        @keyframes optionPulse {
            0% { box-shadow: 0 0 0 0 rgba(84,105,212,0.3); }
            50% { box-shadow: 0 0 0 6px rgba(84,105,212,0.15), 0 0 16px rgba(84,105,212,0.1); }
            100% { box-shadow: 0 0 0 0 rgba(84,105,212,0); }
        }

        .history-section {
            flex: 1;
            overflow-y: auto;
            padding: 6px 8px;
        }

        .history-section h3 {
            padding: 10px 8px 6px;
            font-size: 0.75em;
            color: var(--text-light);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 1px;
            transition: background 0.12s;
            position: relative;
        }

        .history-item:hover { background: var(--surface2); }
        .history-item .delete-btn {
            position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
            display: none; border: none; background: none; cursor: pointer;
            color: var(--text-light); font-size: 0.82em; padding: 4px 6px; border-radius: 4px;
            transition: color 0.15s, background 0.15s;
        }
        .history-item:hover .delete-btn { display: block; }
        .history-item .delete-btn:hover { color: #e74c3c; background: rgba(231,76,60,0.1); }
        .history-item .query { font-size: 0.86em; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
        .history-item .meta { font-size: 0.75em; color: var(--text-light); margin-top: 2px; }
        .history-item .meta .running-badge { color: var(--accent); font-weight: 600; animation: pulse-text 1.5s infinite; }
        @keyframes pulse-text { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .history-group { margin-bottom: 2px; }
        .history-group .history-toggle {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px 1px;
            cursor: pointer;
            border: none;
            background: none;
            font-family: inherit;
            font-size: 0.72em;
            color: var(--text-light);
            font-weight: 500;
            transition: color 0.15s;
            width: 100%;
            text-align: left;
        }
        .history-group .history-toggle:hover { color: var(--accent); }
        .history-group .history-toggle .toggle-icon {
            display: inline-block;
            transition: transform 0.2s;
            font-size: 0.8em;
        }
        .history-group.collapsed .toggle-icon { transform: rotate(-90deg); }
        .history-children {
            overflow: hidden;
            transition: max-height 0.25s ease, opacity 0.2s ease;
            max-height: 500px;
            opacity: 1;
        }
        .history-group.collapsed .history-children {
            max-height: 0;
            opacity: 0;
        }
        .history-children .history-item {
            padding-left: 24px;
            position: relative;
        }
        .history-children .history-item::before {
            content: '';
            position: absolute;
            left: 14px;
            top: 0;
            bottom: 0;
            width: 1.5px;
            background: var(--border);
        }
        .history-children .history-item:last-child::before {
            bottom: 50%;
        }
        .history-children .history-item::after {
            content: '';
            position: absolute;
            left: 14px;
            top: 50%;
            width: 6px;
            height: 1.5px;
            background: var(--border);
        }

        /* ── Main ── */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .input-area {
            padding: 16px 36px 24px;
            background: var(--surface);
            border-top: 1px solid var(--border-light);
            flex-shrink: 0;
            width: 100%;
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .input-row textarea {
            flex: 1;
            padding: 14px 18px;
            background: var(--surface);
            color: var(--text);
            border: 2px solid var(--border);
            border-radius: 20px;
            font-size: 1em;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
            resize: none;
            max-height: 120px;
            line-height: 1.5;
            overflow-y: hidden;
            box-shadow: 0 2px 8px rgba(26,31,54,0.05);
        }

        .input-row textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
        .input-row textarea:disabled { opacity: 0.5; cursor: not-allowed; }

        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--border);
            color: #fff;
            border: none;
            cursor: not-allowed;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.2s, box-shadow 0.2s, transform 0.15s;
        }
        .send-btn.active {
            background: var(--accent);
            cursor: pointer;
            transform: scale(1.05);
        }
        .send-btn.active:hover { background: var(--accent-hover); box-shadow: 0 2px 10px rgba(84,105,212,0.3); transform: scale(1.08); }
        .send-btn.active:active { transform: scale(0.97); }
        .send-btn.stop {
            background: var(--red);
            cursor: pointer;
        }
        .send-btn.stop:hover { background: #c03636; }

        /* ── Chat Messages ── */
        .chat-msg {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
            max-width: 780px;
            animation: fadeInUp 0.3s ease;
        }
        .chat-msg.user {
            margin-left: auto;
            flex-direction: row-reverse;
        }
        .chat-msg-bubble {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.92em;
            line-height: 1.6;
            max-width: 600px;
            word-break: break-word;
        }
        .chat-msg.user .chat-msg-bubble {
            background: var(--accent);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .chat-msg.assistant .chat-msg-bubble {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border-light);
            border-bottom-left-radius: 4px;
        }
        .chat-msg.assistant .chat-msg-bubble p { margin: 2px 0; }
        .chat-msg.assistant .chat-msg-bubble > *:first-child { margin-top: 0; }
        .chat-msg.assistant .chat-msg-bubble > *:last-child { margin-bottom: 0; }
        .chat-msg.assistant .chat-msg-bubble h1,
        .chat-msg.assistant .chat-msg-bubble h2,
        .chat-msg.assistant .chat-msg-bubble h3,
        .chat-msg.assistant .chat-msg-bubble h4 { margin: 12px 0 6px; font-size: 0.95em; }
        .chat-msg.assistant .chat-msg-bubble ul,
        .chat-msg.assistant .chat-msg-bubble ol { padding-left: 20px; margin: 6px 0; }
        .chat-msg.assistant .chat-msg-bubble li { margin: 3px 0; line-height: 1.5; }
        .chat-msg.assistant .chat-msg-bubble code { background: var(--surface2); padding: 1px 5px; border-radius: 4px; font-size: 0.88em; }
        .chat-msg.assistant .chat-msg-bubble blockquote { border-left: 3px solid var(--border); padding-left: 12px; margin: 8px 0; color: var(--text-dim); }
        .chat-msg.assistant .chat-msg-bubble table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 0.88em; }
        .chat-msg.assistant .chat-msg-bubble th,
        .chat-msg.assistant .chat-msg-bubble td { border: 1px solid var(--border-light); padding: 6px 10px; text-align: left; }
        .chat-msg.assistant .chat-msg-bubble hr { margin: 10px 0; border: none; border-top: 1px solid var(--border-light); }
        .chat-typing {
            display: inline-flex;
            gap: 4px;
            padding: 12px 18px;
        }
        .chat-typing span {
            width: 6px; height: 6px;
            background: var(--text-light);
            border-radius: 50%;
            animation: chatBounce 1.4s infinite;
        }
        .chat-typing span:nth-child(2) { animation-delay: 0.2s; }
        .chat-typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes chatBounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-6px); }
        }

        /* ── Results ── */
        .results {
            flex: 1;
            overflow-y: auto;
            padding: 28px 36px;
        }

        /* ── Timeline ── */
        .timeline {
            max-width: 520px;
            margin: 0 auto 28px;
            padding: 0 8px;
        }

        .timeline-item {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            position: relative;
            padding-bottom: 8px;
            min-height: 48px;
        }

        .timeline-item:not(:last-child)::after {
            content: '';
            position: absolute;
            left: 15px;
            top: 34px;
            bottom: 0;
            width: 2px;
            background: var(--border);
            transition: background 0.3s;
        }

        .timeline-item.done:not(:last-child)::after { background: var(--accent); }
        .timeline-item.active:not(:last-child)::after { background: linear-gradient(to bottom, var(--accent), var(--border)); }

        .timeline-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            background: var(--surface2);
            border: 2px solid var(--border);
            color: var(--text-light);
            transition: all 0.3s;
            z-index: 1;
        }

        .timeline-item.done .timeline-icon {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .timeline-item.active .timeline-icon {
            background: var(--accent-light);
            border-color: var(--accent);
            color: var(--accent);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(84,105,212,0.25); }
            50% { box-shadow: 0 0 0 8px rgba(84,105,212,0); }
        }

        .timeline-content {
            flex: 1;
            padding-top: 4px;
        }

        .timeline-label {
            font-size: 0.92em;
            font-weight: 600;
            color: var(--text-light);
            transition: color 0.3s;
        }

        .timeline-item.done .timeline-label { color: var(--accent); }
        .timeline-item.active .timeline-label { color: var(--accent); }

        .timeline-detail {
            font-size: 0.8em;
            color: var(--text-light);
            margin-top: 2px;
            line-height: 1.5;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.3s, opacity 0.3s;
        }

        .timeline-item.done .timeline-detail,
        .timeline-item.active .timeline-detail {
            max-height: 200px;
            opacity: 1;
        }

        .timeline-detail .keyword-tag {
            display: inline-block;
            background: var(--accent-light);
            color: var(--accent);
            padding: 1px 8px;
            border-radius: 4px;
            font-size: 0.9em;
            margin: 2px 2px 0 0;
        }



        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        .fade-out { animation: fadeOut 0.3s ease-in forwards; }

        /* ── Status ── */
        .status-msg {
            text-align: center;
            font-size: 1em;
            font-weight: 500;
            color: var(--text-dim);
            margin-bottom: 8px;
        }
        .status-msg .detail { font-size: 0.84em; font-weight: 400; color: var(--text-light); margin-top: 3px; transition: opacity 0.3s; }
        .status-msg .elapsed { font-size: 0.78em; color: var(--text-light); margin-top: 4px; opacity: 0.5; }

        /* ── 2-Panel Results ── */
        .result-summary-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: var(--surface2);
            border-radius: var(--radius);
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .result-summary-bar .summary-query {
            font-size: 0.88em;
            font-weight: 600;
            color: var(--text);
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .result-summary-bar .summary-stat {
            font-size: 0.78em;
            color: var(--text-light);
            white-space: nowrap;
        }
        .result-summary-bar .summary-stat strong {
            color: var(--accent);
            font-weight: 700;
        }
        .result-summary-bar .summary-sep {
            width: 1px;
            height: 14px;
            background: var(--border);
        }
        .result-meta-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .result-meta-chip {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 2px 8px;
            background: var(--surface2);
            border: 1px solid var(--border-light);
            border-radius: 5px;
            font-size: 0.72em;
            color: var(--text-light);
        }
        .result-report-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }
        .result-report-actions button {
            padding: 7px 14px;
            font-size: 0.8em;
            font-family: inherit;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            color: var(--text-dim);
            cursor: pointer;
            font-weight: 500;
            transition: all 0.15s;
        }
        .result-report-actions button:hover {
            background: var(--surface2);
            color: var(--text);
            border-color: var(--accent);
        }
        .result-report-actions button.btn-preview {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .result-report-actions button.btn-preview:hover {
            opacity: 0.88;
            color: #fff;
        }

        /* ── MD Viewer Modal ── */
        #mdViewerOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10,14,30,0.55);
            backdrop-filter: blur(3px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        #mdViewerOverlay.open { display: flex; }
        #mdViewerModal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: min(860px, 92vw);
            max-height: 88vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 24px 64px rgba(0,0,0,0.22);
            overflow: hidden;
        }
        #mdViewerHeader {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 22px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        #mdViewerHeader h3 {
            margin: 0;
            font-size: 1em;
            font-weight: 600;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #mdViewerHeader h3 span.md-badge {
            background: var(--accent);
            color: #fff;
            font-size: 0.72em;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 600;
            letter-spacing: 0.04em;
        }
        #mdViewerClose {
            background: none;
            border: none;
            font-size: 1.3em;
            cursor: pointer;
            color: var(--text-dim);
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.15s;
        }
        #mdViewerClose:hover { background: var(--surface2); color: var(--text); }
        #mdViewerTabs {
            display: flex;
            gap: 0;
            padding: 0 22px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .md-tab {
            padding: 10px 18px;
            font-size: 0.82em;
            font-weight: 500;
            color: var(--text-dim);
            border: none;
            background: none;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.15s;
            font-family: inherit;
        }
        .md-tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }
        .md-tab:hover:not(.active) { color: var(--text); }
        #mdViewerBody {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
        }
        #mdRendered {
            line-height: 1.75;
            color: var(--text);
            font-size: 0.92em;
        }
        #mdRendered h1 { font-size: 1.5em; margin: 0 0 16px; color: var(--text); border-bottom: 2px solid var(--border); padding-bottom: 8px; }
        #mdRendered h2 { font-size: 1.2em; margin: 24px 0 10px; color: var(--text); }
        #mdRendered h3 { font-size: 1.05em; margin: 18px 0 8px; color: var(--text); }
        #mdRendered ul, #mdRendered ol { padding-left: 22px; margin: 8px 0; }
        #mdRendered li { margin: 4px 0; }
        #mdRendered p { margin: 10px 0; }
        #mdRendered hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
        #mdRendered strong { color: var(--accent); }
        #mdRendered code { background: var(--surface2); padding: 1px 6px; border-radius: 4px; font-size: 0.88em; }
        #mdRaw {
            font-family: 'SFMono-Regular', 'Consolas', monospace;
            font-size: 0.82em;
            line-height: 1.65;
            white-space: pre-wrap;
            word-break: break-word;
            color: var(--text-dim);
            background: var(--surface2);
            padding: 18px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }
        #mdViewerFooter {
            padding: 12px 22px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            flex-shrink: 0;
        }
        #mdViewerFooter button {
            padding: 7px 16px;
            font-size: 0.82em;
            font-family: inherit;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-dim);
            cursor: pointer;

        .panel-right {
            flex: 1;

        .detail-panel {

            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);

        .detail-panel .detail-gap-statement {

        }

        }

        .detail-panel .detail-gap-elaboration {
            font-size: 0.98em;
            color: var(--text-dim);
            line-height: 1.75;
            margin-bottom: 16px;
        }

        .detail-panel .detail-section-title {
            font-size: 0.8em;
            font-weight: 700;

        .detail-panel .supporting-paper-chip {

        .detail-panel .supporting-quote {

            border-left: 3px solid var(--accent2);

        .detail-panel .proposed-topic-box .topic-label {

        .explore-btn {

        }

        .explore-btn:hover { background: var(--accent-hover); box-shadow: 0 2px 8px rgba(84,105,212,0.25); }

        /* Paper detail */
        .detail-panel .paper-detail-title {
            font-size: 1.12em;
            font-weight: 700;
            color: var(--text);

        .detail-panel .paper-detail-meta {

            margin-bottom: 6px;

        }

        .detail-panel .paper-detail-abstract {

            line-height: 1.7;
            margin-top: 12px;
        }

        .detail-panel .paper-detail-link {

        .detail-panel .paper-detail-link:hover { text-decoration: underline; }

        .detail-panel .paper-limitation-item {

        .paper-lim-card {

        }
        .paper-lim-claim { font-size: 0.9em; font-weight: 500; line-height: 1.55; color: var(--text); }
        .paper-lim-quote { font-size: 0.82em; font-style: italic; color: var(--text-dim); margin-top: 6px; padding-left: 10px; line-height: 1.5; }

        /* ── Master Report Collapse ── */
        .report-master-collapse {
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            background: var(--surface);
        }
        .report-master-toggle {
            width: 100%;
            padding: 14px 20px;
            background: var(--surface);
            border: none;
            border-bottom: 1px solid var(--border-light);
            cursor: pointer;
            font-family: inherit;
            font-size: 0.95em;
            font-weight: 600;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.15s;
            position: sticky;
            top: 0;
            z-index: 10;
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        }
        .report-master-toggle:hover { background: var(--surface2); }

        .report-download-btn {
            padding: 6px 14px;
            font-size: 0.82em;
            font-family: inherit;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            color: var(--text-dim);
            cursor: pointer;
            font-weight: 500;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .report-download-btn:hover { background: var(--surface2); color: var(--text); border-color: var(--accent); }

        .report-master-toggle .toggle-arrow {
            transition: transform 0.25s ease;
            font-size: 0.8em;
        }
        .report-master-collapse.open .toggle-arrow {
            transform: rotate(180deg);
        }
        .report-master-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
        }
        .report-master-collapse.open .report-master-body {
            max-height: calc(100vh - 180px);
            overflow-y: auto;
        }
        .report-master-body-inner {
            padding: 0 20px 20px;
        }
        #chatContainer {
            margin-top: 24px;
        }

        /* ── Report Content (download only, not rendered) ── */
        .report-content { font-size: 1.02em; line-height: 1.55; color: var(--text); }
        .report-content h1 { font-size: 1.45em; color: var(--text); margin: 20px 0 8px; padding-bottom: 6px; border-bottom: 2px solid var(--accent); font-weight: 700; }
        .report-content h2 { font-size: 1.25em; color: var(--text); margin: 16px 0 6px; padding: 4px 10px; font-weight: 700; background: linear-gradient(transparent 40%, rgba(99,102,241,0.18) 40%); display: inline-block; border-radius: 3px; }
        .report-content h3 { font-size: 1.1em; color: var(--accent); margin: 12px 0 6px; font-weight: 600; }
        .report-content h4 { font-size: 1em; color: var(--text); margin: 14px 0 6px; font-weight: 600; padding: 6px 12px; background: var(--surface2); border-left: 3px solid var(--accent); border-radius: 0 var(--radius) var(--radius) 0; }
        .report-content strong { color: var(--text); }
        .report-content table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 0.92em; }
        .report-content th { text-align: left; padding: 10px 12px; background: var(--surface2); color: var(--text-dim); font-weight: 600; font-size: 0.85em; text-transform: uppercase; letter-spacing: 0.3px; border-bottom: 2px solid var(--border); }
        .report-content td { padding: 9px 12px; border-bottom: 1px solid var(--border-light); color: var(--text); }
        .report-content tr:hover { background: var(--accent-bg); }
        .report-content code { background: var(--surface2); padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
        .report-content ul, .report-content ol { padding-left: 22px; margin: 4px 0; }
        .report-content li { margin-bottom: 3px; line-height: 1.6; }
        .report-content blockquote { border-left: 3px solid var(--accent); padding: 8px 14px; margin: 8px 0; background: var(--accent-bg); border-radius: 0 var(--radius) var(--radius) 0; font-style: italic; color: var(--text-dim); }
        .report-content hr { border: none; border-top: 1px solid var(--border-light); margin: 14px 0; }
        .report-content p { margin: 4px 0; }
        .report-content .gap-break { display: block; margin-top: 12px; }

        /* ── Interrupt ── */
        .interrupt-card {
            background: var(--surface);
            border: 2px solid var(--yellow);
            border-radius: var(--radius-lg);
            padding: 22px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }
        .interrupt-card h3 { color: var(--yellow); margin-bottom: 10px; font-size: 1em; }
        .interrupt-card .prompt { font-size: 0.9em; color: var(--text); margin-bottom: 14px; padding: 14px; background: var(--yellow-light); border-radius: var(--radius); line-height: 1.6; }
        .interrupt-card input {
            width: 100%;
            padding: 11px 14px;
            background: var(--surface2);
            color: var(--text);
            border: 1.5px solid var(--border);
            border-radius: 8px;
            margin-bottom: 12px;
            font-family: inherit;
            font-size: 0.9em;
            outline: none;
            transition: border-color 0.15s;
        }
        .interrupt-card input:focus { border-color: var(--yellow); }
        .interrupt-actions { display: flex; gap: 8px; }
        .interrupt-actions button {
            padding: 9px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.88em;
            font-family: inherit;
            transition: all 0.15s;
        }
        .btn-resume { background: var(--accent); color: #fff; }
        .btn-resume:hover { background: var(--accent-hover); }
        .btn-skip { background: var(--surface2); color: var(--text-dim); border: 1px solid var(--border); }
        .btn-skip:hover { background: var(--surface3); }

        /* ── Landing: Workflow Section ── */
        .workflow-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            margin: 28px auto 0;
            max-width: 680px;
            padding: 0 16px;
        }

        .workflow-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .workflow-step .wf-icon {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--accent-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .workflow-step .wf-label {
            font-size: 0.82em;
            font-weight: 600;
            color: var(--text);
            text-align: center;
        }

        .workflow-arrow {
            font-size: 1.2em;
            color: var(--text-light);
            margin: 0 -4px;
            padding-bottom: 24px;
        }

        /* ── Landing: Service Cards ── */
        .service-cards-section {
            max-width: 720px;
            margin: 32px auto 0;
            padding: 0 16px;
        }

        .service-cards-section h3 {
            text-align: center;
            font-size: 1.06em;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 16px;
        }

        .service-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }

        .service-card {
            background: var(--surface);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 20px 16px;
            text-align: center;
            box-shadow: var(--shadow-sm);
        }

        .service-card .sc-icon {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .service-card .sc-title {
            font-size: 0.9em;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 6px;
        }

        .service-card .sc-desc {
            font-size: 0.78em;
            color: var(--text-light);
            line-height: 1.5;
        }

        /* ── Empty state (examples) ── */
        .empty-state { text-align: center; padding: 60px 20px 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; }
        .empty-state .subtitle { font-size: 0.96em; color: var(--text-dim); line-height: 1.65; max-width: 520px; margin: 0 auto; }
        .example-queries { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 32px; max-width: 720px; margin-left: auto; margin-right: auto; }
        .example-queries .label { grid-column: 1 / -1; font-size: 0.8em; color: var(--text-light); margin-bottom: 0; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; text-align: center; }
        .example-card { background: var(--surface); border: 1px solid var(--border-light); border-radius: var(--radius-lg); padding: 16px; display: flex; flex-direction: column; gap: 6px; }
        .example-card .example-category { font-size: 0.78em; color: var(--accent); font-weight: 600; letter-spacing: 0.3px; margin: 0 0 4px; }
        .example-btn {
            background: var(--surface2);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 9px 14px;
            font-size: 0.86em;
            color: var(--text-dim);
            cursor: pointer;
            font-family: inherit;
            transition: all 0.15s;
            width: 100%;
            text-align: left;
        }
        .example-btn:hover { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }

        /* ── Error banner ── */
        .error-banner {
            background: var(--red-light);
            border: 1px solid var(--red);
            border-radius: var(--radius);
            padding: 16px 20px;
            margin-top: 16px;
            text-align: center;
        }
        .error-banner .msg { color: var(--red); font-size: 0.94em; font-weight: 500; margin-bottom: 10px; }
        .error-banner button {
            padding: 8px 20px;
            background: var(--red);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.88em;
            font-family: inherit;
            transition: opacity 0.15s;
        }
        .error-banner button:hover { opacity: 0.85; }

        /* ── GAP Axis Color Badges ── */
        .axis-badge {
            display: inline-block;
            font-size: 0.7em;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
            vertical-align: middle;
            white-space: nowrap;
        }

        /* ── Progress Bar ── */
        .preview-progress {
            margin-bottom: 16px;
            animation: fadeInUp 0.3s ease;
        }
        .preview-progress-label {
            font-size: 0.84em;
            color: var(--text-dim);
            font-weight: 500;
            margin-bottom: 6px;
        }
        .preview-progress-bar {
            width: 100%;
            height: 6px;
            background: var(--surface2);
            border-radius: 3px;
            overflow: hidden;
        }
        .preview-progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 3px;
            transition: width 0.4s ease;
        }
        .preview-progress-detail {
            font-size: 0.78em;
            color: var(--text-light);
            margin-top: 4px;
        }

        /* ── Limitation Claim Streaming ── */
        .lim-claim-stream { display: flex; flex-direction: column; gap: 6px; max-height: 300px; overflow-y: auto; }
        .lim-claim-item {
            font-size: 0.84em; color: var(--text); padding: 8px 12px;
            background: var(--surface2); border-radius: 8px; border-left: 3px solid #f0d8a0;
            animation: fadeInUp 0.35s ease both; line-height: 1.45;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ── Query Preview ── */
        .preview-query-box {
            padding: 14px 16px;
            background: var(--accent-bg);
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            margin-bottom: 10px;
        }
        .preview-query-label {
            font-size: 0.75em;
            font-weight: 600;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 4px;
        }
        .preview-query-text {
            font-size: 0.94em;
            font-weight: 600;
            color: var(--text);
            line-height: 1.5;
        }
        .preview-keywords {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 8px;
        }
        .preview-keyword-tag {
            display: inline-block;
            background: var(--accent-light);
            color: var(--accent);
            padding: 2px 10px;
            border-radius: 5px;
            font-size: 0.82em;
            font-weight: 500;
        }

        /* ── Analysis Options Bar ── */
        .analysis-options-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .opt-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            background: var(--surface2);
            border: 1px solid var(--border-light);
            border-radius: 6px;
            font-size: 0.78em;
            color: var(--text-dim);
            font-weight: 500;
        }
        .opt-chip .opt-label { color: var(--text-light); font-weight: 400; margin-right: 2px; }

        /* ── Timeline Collapse ── */
        .timeline.collapsing {
            max-height: 600px;
            overflow: hidden;
            transition: max-height 0.6s ease, opacity 0.4s ease;
        }
        .timeline.collapsed {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        /* ── Analysis 2-Split Layout ── */
        .analysis-layout {
            max-width: 1100px;
            margin: 0 auto;
        }

        .analysis-status-bar {
            text-align: center;
            padding: 16px 20px 12px;
            margin-bottom: 8px;
        }
        .analysis-status-bar .status-text {
            font-size: 1em;
            font-weight: 600;
            color: var(--text);
        }
        .analysis-status-bar .status-detail {
            font-size: 0.84em;
            font-weight: 400;
            color: var(--text-light);
            margin-top: 3px;
            transition: opacity 0.3s;
        }
        .analysis-status-bar .status-elapsed {
            font-size: 0.78em;
            color: var(--text-light);
            margin-top: 4px;
            opacity: 0.5;
        }

<script>
// User ID
function getUserId() {
    let uid = localStorage.getItem('gapago_user_id');
    if (!uid) { uid = 'u_' + Math.random().toString(36).slice(2, 10); localStorage.setItem('gapago_user_id', uid); }
    return uid;
}
const USER_ID = getUserId();

window.onerror = function(msg, url, line) {
    const d = document.createElement('div');
    d.style.cssText = 'position:fixed;top:0;left:0;right:0;padding:10px;background:#e54e4e;color:#fff;z-index:9999;font-size:13px';
    d.textContent = `Error (line ${line}): ${msg}`;
    document.body.prepend(d);
};

// ── Timeline configuration ──
const TIMELINE_NODES = [
    { id: 'query', label: '질문 분석 & 확장', nodes: ['query_subgraph', 'meaning_expand'] },
    { id: 'retrieval', label: '논문 검색', nodes: ['paper_retrieval'] },
    { id: 'limitation', label: '한계점 추출', nodes: ['limitation_extract'] },
    { id: 'eval', label: '한계점 평가', nodes: ['limitation_eval'] },
    { id: 'recency', label: '최신성 검증', nodes: ['recency_check'] },
    { id: 'gap', label: '연구 GAP 도출', nodes: ['gap_infer'] },
    { id: 'critic', label: '결과 검증', nodes: ['critic_score'] },
    { id: 'report', label: '리포트 작성', nodes: ['final_response'] },
];

const THINKING_MESSAGES = [
    '더 나은 결과를 위해 깊이 분석 중...',
    '데이터를 꼼꼼히 검토하고 있습니다...',
    '교차 검증을 진행하고 있습니다...',
    '거의 완료되었습니다 — 분석을 정리하고 있습니다...',
];

let _thinkingInterval = null;
let _startTime = null;
let _elapsedInterval = null;
let currentSessionId = null;
let _activeReader = null;

let pipelineData = {
    refined_query: '',
    keywords: [],
    papers: [],
    total_searched: 0,
    limitations: [],
    limitation_eval: {},
    recency_status: {},
    gaps: [],
    report: '',
    analysisOptions: {},
};

// Axis color palette for GAP visualization
const AXIS_COLORS = [
    { bg: '#eef0fb', color: '#5469d4', border: '#5469d4' },
    { bg: '#f3eefa', color: '#7c5cbf', border: '#7c5cbf' },
    { bg: '#eaf6f0', color: '#0d9668', border: '#0d9668' },
    { bg: '#fef5e7', color: '#c27a0e', border: '#c27a0e' },
    { bg: '#feeef0', color: '#d44a4a', border: '#d44a4a' },
    { bg: '#e9f4fb', color: '#2e7dba', border: '#2e7dba' },
    { bg: '#f4eefb', color: '#8e4ec6', border: '#8e4ec6' },
];
function getAxisColor(axisName) {
    // Deterministic color based on axis name hash
    let hash = 0;
    for (let i = 0; i < axisName.length; i++) hash = ((hash << 5) - hash + axisName.charCodeAt(i)) | 0;
    return AXIS_COLORS[Math.abs(hash) % AXIS_COLORS.length];
}

// Progress state for live preview
let _progressData = { node: '', detail: '', current: 0, total: 0, progress: 0, pipeline_progress_pct: 0, elapsed_s: 0, estimated_remaining_s: 0 };

// Track timeline detail text per node
let timelineDetails = {};
// Track which timeline step is active/done
let timelineState = {};  // { id: 'pending' | 'active' | 'done' }

// Selected item in results panel
let selectedItem = { type: null, index: 0 };

const EXAMPLE_CATEGORIES = {
    'AI / Machine Learning': [

    'Quantum / Physics': [
        'Quantum error correction for near-term noisy quantum devices',
        'Variational quantum eigensolvers for molecular simulation',
        'Topological insulator applications in spintronics',
        'Machine learning potentials for molecular dynamics simulation',
        'Photonic integrated circuits for quantum communication',
        'Plasma confinement optimization in compact fusion reactors',
    ],

function getRandomExamples(perCategory = 2) {
    const cats = Object.keys(EXAMPLE_CATEGORIES);
    const shuffled = cats.sort(() => Math.random() - 0.5);
    const selected = shuffled.slice(0, 4);
    const examples = [];
    selected.forEach(cat => {
        const qs = [...EXAMPLE_CATEGORIES[cat]].sort(() => Math.random() - 0.5).slice(0, perCategory);
        examples.push({ category: cat, queries: qs });
    });
    return examples;
}

function getEmptyStateHTML() {
    const examples = getRandomExamples(2);
    let cardsHTML = '';
    examples.forEach(({ category, queries }) => {
        let btns = queries.map(q =>
            `<button class="example-btn" onclick="fillQuery('${q.replace(/'/g, "\\'")}')">${esc(q)}</button>`
        ).join('');
        cardsHTML += `<div class="example-card"><span class="example-category">${esc(category)}</span>${btns}</div>`;
    });
    return `
    <div class="empty-state">
        <h2 style="font-size:1.5em;font-weight:700;color:var(--text);margin-bottom:8px;letter-spacing:-0.3px;">키워드 또는 논문 제목으로 시작해보세요</h2>

// Current mode: 'analyze' or 'chat'
let _inputMode = 'analyze';
let _chatSessionId = null;
let _chatFilename = null;

document.addEventListener('DOMContentLoaded', async function() {
    document.getElementById('results').innerHTML = getEmptyStateHTML();
    await loadHistory();

    // Reconnect to active session after page refresh
    const savedSessionId = localStorage.getItem('gapago_active_session');
    if (savedSessionId) {
        try {
            const statusResp = await fetch(`api/status/${savedSessionId}`);
            const statusData = await statusResp.json();
            if (statusData.status === 'running' || statusData.status === 'interrupted') {
                currentSessionId = savedSessionId;
                reconnectToSession(savedSessionId, statusData.query || '');
            } else {
                // 세션 소멸 (서버 재시작 등) — 조용히 초기 화면으로
                localStorage.removeItem('gapago_active_session');
                newAnalysis();
            }
        } catch (e) {
            localStorage.removeItem('gapago_active_session');
            newAnalysis();
        }
    }
});

async function loadHistory() {
    try {
        const resp = await fetch(`api/history?user_id=${USER_ID}`);
        const items = await resp.json();
        const section = document.getElementById('historySection');
        section.innerHTML = '<h3>분석 히스토리</h3>';

        // Build parent-children map
        // parentMap: parentSessionId -> [child items]
        const parentMap = {};
        const roots = [];
        const sessionItemMap = {}; // sessionId -> item (for matching parents)

        items.forEach(item => {
            const sid = item.session_id || '';
            if (sid) sessionItemMap[sid] = item;
        });

        items.forEach(item => {
            const psid = item.parent_session_id || '';
            if (psid && sessionItemMap[psid]) {
                // This item has a parent that exists in the list
                if (!parentMap[psid]) parentMap[psid] = [];
                parentMap[psid].push(item);
            } else {
                roots.push(item);
            }
        });

        function renderHistoryItem(item) {
            const div = document.createElement('div');
            div.className = 'history-item';
            const ts = item.timestamp ? new Date(item.timestamp).toLocaleString('ko-KR', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
            if (item.status === 'running' || item.status === 'interrupted') {
                div.onclick = () => reconnectToSession(item.session_id, item.query);
                div.innerHTML = `<div class="query">${esc(item.query)}</div><div class="meta"><span class="running-badge">분석 중...</span> &middot; ${ts}</div>`;
            } else {
                div.onclick = () => loadResult(item.filename);
                div.innerHTML = `<div class="query">${esc(item.query)}</div><div class="meta">${ts} &middot; ${item.gaps_count} GAPs</div>`;
            }
            // Delete button
            if (item.filename) {
                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.title = '삭제';
                delBtn.innerHTML = '&#x2715;';
                delBtn.onclick = (e) => { e.stopPropagation(); deleteHistoryItem(item.filename); };
                div.appendChild(delBtn);
            }
            return div;
        }

        roots.forEach(item => {
            const sid = item.session_id || '';
            const children = sid ? (parentMap[sid] || []) : [];

            if (children.length > 0) {
                // Render as a group with toggle
                const group = document.createElement('div');
                group.className = 'history-group';

                // Parent item
                group.appendChild(renderHistoryItem(item));

                // Toggle button
                const toggle = document.createElement('button');
                toggle.className = 'history-toggle';
                toggle.innerHTML = `<span class="toggle-icon">&#x25BC;</span> 추가 탐색 ${children.length}건`;
                toggle.onclick = (e) => { e.stopPropagation(); group.classList.toggle('collapsed'); };
                group.appendChild(toggle);

                // Children container
                const childrenDiv = document.createElement('div');
                childrenDiv.className = 'history-children';
                children.forEach(child => {
                    childrenDiv.appendChild(renderHistoryItem(child));
                });
                group.appendChild(childrenDiv);

                section.appendChild(group);
            } else {
                // Standalone item
                section.appendChild(renderHistoryItem(item));
            }
        });

        if (!items.length) section.innerHTML += '<div style="padding:14px;color:var(--text-light);font-size:0.78em">아직 분석 기록이 없습니다.</div>';
    } catch (e) { console.error(e); }
}

async function deleteHistoryItem(filename) {
    if (!confirm('이 분석 기록을 삭제하시겠습니까?')) return;
    try {
        const resp = await fetch(`api/history/${filename}`, { method: 'DELETE' });
        if (!resp.ok) throw new Error('삭제 실패');
        loadHistory();
    } catch (e) { console.error(e); alert('삭제에 실패했습니다.'); }
}

async function loadResult(filename) {
    try {
        const resp = await fetch(`api/history/${filename}`);
        const data = await resp.json();
        renderSavedResult(data);
        switchToChatMode(data.session_id || '', filename);
        setInputEnabled(true);
    } catch (e) { console.error(e); }
}

function fillQuery(q) {
    document.getElementById('queryInput').value = q;
    document.getElementById('queryInput').focus();
    autoResizeTextarea(document.getElementById('queryInput'));
    toggleSendBtn();
}

function setInputEnabled(enabled) {
    document.getElementById('queryInput').disabled = !enabled;
    document.getElementById('provider').disabled = !enabled;
    document.getElementById('yearRange').disabled = !enabled;
    document.getElementById('outputLanguage').disabled = !enabled;
    const domainEl = document.getElementById('domain');
    if (domainEl) domainEl.disabled = !enabled;

    const sendBtn = document.getElementById('sendBtn');
    if (enabled) {
        sendBtn.className = 'send-btn';
        sendBtn.disabled = true;
        sendBtn.onclick = handleSend;
        toggleSendBtn();
    } else {
        sendBtn.className = 'send-btn stop';
        sendBtn.disabled = false;
        sendBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>';
        sendBtn.onclick = stopAnalysis;
    }
}

function autoResizeTextarea(el) {
    el.style.height = 'auto';
    const h = Math.min(el.scrollHeight, 120);
    el.style.height = h + 'px';
    el.style.overflowY = el.scrollHeight > 120 ? 'auto' : 'hidden';
}

function toggleSendBtn() {
    const input = document.getElementById('queryInput');
    const btn = document.getElementById('sendBtn');
    const hasText = input.value.trim().length > 0;
    if (hasText) {
        btn.classList.add('active');
        btn.disabled = false;
    } else {
        btn.classList.remove('active');
        btn.disabled = true;
    }
}

function handleInputKeydown(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (document.getElementById('queryInput').value.trim()) handleSend();
    }
}

function handleSend() {
    if (_inputMode === 'chat') {
        sendChatMessage();
    } else {
        startAnalysis();
    }
}

function switchToAnalyzeMode() {
    _inputMode = 'analyze';
    const input = document.getElementById('queryInput');
    input.placeholder = '연구하고 싶은 주제를 입력하세요';
    const sendBtn = document.getElementById('sendBtn');
    sendBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>';
}

function switchToChatMode(sessionId, filename) {
    _inputMode = 'chat';
    _chatSessionId = sessionId || null;
    _chatFilename = filename || null;
    const input = document.getElementById('queryInput');
    input.placeholder = '분석 결과에 대해 질문하세요...';

async function sendChatMessage() {
    const input = document.getElementById('queryInput');
    const message = input.value.trim();
    if (!message) return;

    input.value = '';
    autoResizeTextarea(input);
    toggleSendBtn();

    // Append user message bubble to chat container
    const chatContainer = document.getElementById('chatContainer');
    const scrollContainer = document.getElementById('results');
    const userMsg = document.createElement('div');
    userMsg.className = 'chat-msg user';
    userMsg.innerHTML = `<div class="chat-msg-bubble">${esc(message)}</div>`;
    chatContainer.appendChild(userMsg);

    // Typing indicator
    const typingEl = document.createElement('div');
    typingEl.className = 'chat-msg assistant';
    typingEl.innerHTML = `<div class="chat-msg-bubble"><div class="chat-typing"><span></span><span></span><span></span></div></div>`;
    chatContainer.appendChild(typingEl);
    scrollContainer.scrollTop = scrollContainer.scrollHeight;

    try {
        const resp = await fetch('api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_id: _chatSessionId || '', message, filename: _chatFilename || '' }),
        });
        typingEl.remove();

        if (!resp.ok) {
            const errText = await resp.text();
            const errEl = document.createElement('div');
            errEl.className = 'chat-msg assistant';
            errEl.innerHTML = `<div class="chat-msg-bubble" style="color:var(--red)">오류: ${esc(errText)}</div>`;
            chatContainer.appendChild(errEl);
        } else {
            const data = await resp.json();
            const aiMsg = document.createElement('div');
            aiMsg.className = 'chat-msg assistant';
            aiMsg.innerHTML = `<div class="chat-msg-bubble">${renderMarkdown(data.response)}</div>`;
            chatContainer.appendChild(aiMsg);
        }
    } catch (e) {
        typingEl.remove();
        const errEl = document.createElement('div');
        errEl.className = 'chat-msg assistant';
        errEl.innerHTML = `<div class="chat-msg-bubble" style="color:var(--red)">네트워크 오류: ${esc(e.message)}</div>`;
        chatContainer.appendChild(errEl);
    }
    scrollContainer.scrollTop = scrollContainer.scrollHeight;
}

function newAnalysis() {
    document.getElementById('queryInput').value = '';
    clearInterval(_thinkingInterval);
    clearInterval(_elapsedInterval);
    currentSessionId = null;
    _completedNodes = new Set();
    localStorage.removeItem('gapago_active_session');
    if (_activeReader) { try { _activeReader.cancel(); } catch(e) {} _activeReader = null; }
    document.getElementById('results').innerHTML = getEmptyStateHTML();
    switchToAnalyzeMode();
    setInputEnabled(true);
}

function validateOptions() {
    const ids = ['provider', 'yearRange', 'outputLanguage'];
    let valid = true;
    ids.forEach(id => {
        const el = document.getElementById(id);
        el.classList.remove('shake');
        if (!el.value) {
            valid = false;
            // trigger reflow to restart animation if already applied
            void el.offsetWidth;
            el.classList.add('shake');
            el.addEventListener('animationend', () => el.classList.remove('shake'), { once: true });
        }
    });
    if (!valid) {
        // scroll sidebar to make options visible and add pulse glow
        const section = document.querySelector('.settings-section');
        if (section) {
            section.scrollIntoView({ behavior: 'smooth', block: 'center' });
            section.classList.remove('option-highlight');
            void section.offsetWidth;
            section.classList.add('option-highlight');
            section.addEventListener('animationend', () => section.classList.remove('option-highlight'), { once: true });
        }
    }
    return valid;
}

async function startAnalysis() {
    const query = document.getElementById('queryInput').value.trim();
    if (!query) { document.getElementById('queryInput').focus(); return; }
    if (!validateOptions()) return;

    const provider = document.getElementById('provider').value;
    const domain = 'auto';
    const yearRange = document.getElementById('yearRange').value;
    const outputLanguage = document.getElementById('outputLanguage').value;

    setInputEnabled(false);
    const providerLabels = { azure: 'Azure GPT', claude: 'Claude', gemini: 'Gemini', exaone: 'EXAONE' };
    const yearLabels = { auto: '자동 추천', '1y': '최근 1년', '3y': '최근 3년', '5y': '최근 5년' };
    const langLabels = { auto: '자동 감지', ko: '한국어', en: 'English' };
    destroyCyGraph();
    pipelineData = { refined_query: '', keywords: [], papers: [], total_searched: 0, limitations: [], limitation_eval: {}, recency_status: {}, gaps: [], report: '', analysisOptions: { provider: providerLabels[provider] || provider, yearRange: yearLabels[yearRange] || yearRange, outputLanguage: langLabels[outputLanguage] || outputLanguage } };
    _progressData = { node: '', detail: '', current: 0, total: 0, progress: 0, pipeline_progress_pct: 0, elapsed_s: 0, estimated_remaining_s: 0 };
    timelineDetails = {};
    timelineState = {};
    TIMELINE_NODES.forEach(n => { timelineState[n.id] = 'pending'; });
    _startTime = Date.now();
    clearInterval(_thinkingInterval);
    clearInterval(_elapsedInterval);

    showPipelineUI();

    try {
        const fastMode = document.getElementById('fastMode')?.checked || false;
        const params = new URLSearchParams({ query, provider, domain, year_range: yearRange, output_language: outputLanguage, user_id: USER_ID, ...(fastMode ? {fast_mode: 'true'} : {}) });
        const resp = await fetch(`api/analyze?${params}`);
        if (!resp.ok) {
            showError(`API 오류 (${resp.status}): ${await resp.text()}`);
            setInputEnabled(true);
            return;
        }
        const { session_id } = await resp.json();
        currentSessionId = session_id;
        localStorage.setItem('gapago_active_session', session_id);
        loadHistory();

        await connectToStream(session_id);
    } catch (e) {
        showError(e.message);
    }
}
