<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAPAGO - Research GAP Analyzer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #f5f6fa;
            --surface: #ffffff;
            --surface2: #f0f2f8;
            --surface3: #e8eaf3;
            --border: #dfe3ed;
            --border-light: #eceef5;
            --text: #1a1f36;
            --text-dim: #5e6687;
            --text-light: #8e94ab;
            --accent: #5469d4;
            --accent-hover: #4255b8;
            --accent-light: #eef0fb;
            --accent-bg: #f6f7fe;
            --accent2: #7c5cbf;
            --green: #0fba81;
            --green-light: #eafaf4;
            --yellow: #e8920b;
            --yellow-light: #fef8ec;
            --red: #e54e4e;
            --red-light: #fef0f0;
            --done: #3d8fd4;
            --done-light: #eaf3fb;
            --shadow-sm: 0 1px 2px rgba(26,31,54,0.04);
            --shadow: 0 2px 8px rgba(26,31,54,0.06);
            --shadow-md: 0 4px 16px rgba(26,31,54,0.08);
            --radius: 10px;
            --radius-lg: 14px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Pretendard Variable', 'Pretendard', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
            font-size: 17px;
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Sidebar ── */
        .sidebar {
            width: 272px;
            background: var(--surface);
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 20px 18px;
            border-bottom: 1px solid var(--border-light);
        }

        .sidebar-header h1 {
            font-size: 1.25em;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: -0.4px;
        }

        .sidebar-header p {
            font-size: 0.8em;
            color: var(--text-light);
            margin-top: 1px;
            font-weight: 400;
        }

        .new-btn {
            margin: 14px 14px 10px;
            padding: 10px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.88em;
            font-family: inherit;
            transition: background 0.15s, box-shadow 0.15s;
            letter-spacing: 0.1px;
        }

        .new-btn:hover { background: var(--accent-hover); box-shadow: 0 2px 8px rgba(84,105,212,0.25); }

        .settings-section {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border-light);
        }

        .settings-section label {
            display: block;
            font-size: 0.75em;
            color: var(--text-light);
            margin-bottom: 3px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .settings-section select {
            width: 100%;
            padding: 8px 10px;
            background: var(--surface2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.86em;
            margin-bottom: 8px;
            font-family: inherit;
            cursor: pointer;
            outline: none;
            transition: border-color 0.15s;
        }
        .settings-section select:focus { border-color: var(--accent); }

        .history-section {
            flex: 1;
            overflow-y: auto;
            padding: 6px 8px;
        }

        .history-section h3 {
            padding: 10px 8px 6px;
            font-size: 0.75em;
            color: var(--text-light);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 1px;
            transition: background 0.12s;
        }

        .history-item:hover { background: var(--surface2); }
        .history-item .query { font-size: 0.86em; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
        .history-item .meta { font-size: 0.75em; color: var(--text-light); margin-top: 2px; }
        .history-item .meta .running-badge { color: var(--accent); font-weight: 600; animation: pulse-text 1.5s infinite; }
        @keyframes pulse-text { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .history-group { margin-bottom: 2px; }
        .history-group .history-toggle {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px 1px;
            cursor: pointer;
            border: none;
            background: none;
            font-family: inherit;
            font-size: 0.72em;
            color: var(--text-light);
            font-weight: 500;
            transition: color 0.15s;
            width: 100%;
            text-align: left;
        }
        .history-group .history-toggle:hover { color: var(--accent); }
        .history-group .history-toggle .toggle-icon {
            display: inline-block;
            transition: transform 0.2s;
            font-size: 0.8em;
        }
        .history-group.collapsed .toggle-icon { transform: rotate(-90deg); }
        .history-children {
            overflow: hidden;
            transition: max-height 0.25s ease, opacity 0.2s ease;
            max-height: 500px;
            opacity: 1;
        }
        .history-group.collapsed .history-children {
            max-height: 0;
            opacity: 0;
        }
        .history-children .history-item {
            padding-left: 24px;
            position: relative;
        }
        .history-children .history-item::before {
            content: '';
            position: absolute;
            left: 14px;
            top: 0;
            bottom: 0;
            width: 1.5px;
            background: var(--border);
        }
        .history-children .history-item:last-child::before {
            bottom: 50%;
        }
        .history-children .history-item::after {
            content: '';
            position: absolute;
            left: 14px;
            top: 50%;
            width: 6px;
            height: 1.5px;
            background: var(--border);
        }

        /* ── Main ── */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .input-area {
            padding: 16px 36px 24px;
            background: var(--surface);
            border-top: none;
            box-shadow: 0 -4px 16px rgba(26,31,54,0.06);
            flex-shrink: 0;
            max-width: 960px;
            margin: 0 auto;
            width: 100%;
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .input-row textarea {
            flex: 1;
            padding: 14px 18px;
            background: var(--surface);
            color: var(--text);
            border: 2px solid var(--border);
            border-radius: 20px;
            font-size: 1em;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
            resize: none;
            max-height: 120px;
            line-height: 1.5;
            overflow-y: auto;
            box-shadow: 0 2px 8px rgba(26,31,54,0.05);
        }

        .input-row textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
        .input-row textarea:disabled { opacity: 0.5; cursor: not-allowed; }

        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--border);
            color: #fff;
            border: none;
            cursor: not-allowed;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.2s, box-shadow 0.2s, transform 0.15s;
        }
        .send-btn.active {
            background: var(--accent);
            cursor: pointer;
            transform: scale(1.05);
        }
        .send-btn.active:hover { background: var(--accent-hover); box-shadow: 0 2px 10px rgba(84,105,212,0.3); transform: scale(1.08); }
        .send-btn.active:active { transform: scale(0.97); }
        .send-btn.stop {
            background: var(--red);
            cursor: pointer;
        }
        .send-btn.stop:hover { background: #c03636; }

        /* ── Chat Messages ── */
        .chat-msg {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
            max-width: 780px;
            animation: fadeInUp 0.3s ease;
        }
        .chat-msg.user {
            margin-left: auto;
            flex-direction: row-reverse;
        }
        .chat-msg-bubble {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.92em;
            line-height: 1.6;
            max-width: 600px;
            word-break: break-word;
        }
        .chat-msg.user .chat-msg-bubble {
            background: var(--accent);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .chat-msg.assistant .chat-msg-bubble {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border-light);
            border-bottom-left-radius: 4px;
        }
        .chat-msg.assistant .chat-msg-bubble p { margin: 4px 0; }
        .chat-typing {
            display: inline-flex;
            gap: 4px;
            padding: 12px 18px;
        }
        .chat-typing span {
            width: 6px; height: 6px;
            background: var(--text-light);
            border-radius: 50%;
            animation: chatBounce 1.4s infinite;
        }
        .chat-typing span:nth-child(2) { animation-delay: 0.2s; }
        .chat-typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes chatBounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-6px); }
        }

        /* ── Results ── */
        .results {
            flex: 1;
            overflow-y: auto;
            padding: 28px 36px;
        }

        /* ── Timeline ── */
        .timeline {
            max-width: 520px;
            margin: 0 auto 28px;
            padding: 0 8px;
        }

        .timeline-item {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            position: relative;
            padding-bottom: 8px;
            min-height: 48px;
        }

        .timeline-item:not(:last-child)::after {
            content: '';
            position: absolute;
            left: 15px;
            top: 34px;
            bottom: 0;
            width: 2px;
            background: var(--border);
            transition: background 0.3s;
        }

        .timeline-item.done:not(:last-child)::after { background: var(--done); }
        .timeline-item.active:not(:last-child)::after { background: linear-gradient(to bottom, var(--accent), var(--border)); }

        .timeline-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            background: var(--surface2);
            border: 2px solid var(--border);
            color: var(--text-light);
            transition: all 0.3s;
            z-index: 1;
        }

        .timeline-item.done .timeline-icon {
            background: var(--done);
            border-color: var(--done);
            color: #fff;
        }

        .timeline-item.active .timeline-icon {
            background: var(--accent-light);
            border-color: var(--accent);
            color: var(--accent);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(84,105,212,0.25); }
            50% { box-shadow: 0 0 0 8px rgba(84,105,212,0); }
        }

        .timeline-content {
            flex: 1;
            padding-top: 4px;
        }

        .timeline-label {
            font-size: 0.92em;
            font-weight: 600;
            color: var(--text-light);
            transition: color 0.3s;
        }

        .timeline-item.done .timeline-label { color: var(--done); }
        .timeline-item.active .timeline-label { color: var(--accent); }

        .timeline-detail {
            font-size: 0.8em;
            color: var(--text-light);
            margin-top: 2px;
            line-height: 1.5;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.3s, opacity 0.3s;
        }

        .timeline-item.done .timeline-detail,
        .timeline-item.active .timeline-detail {
            max-height: 200px;
            opacity: 1;
        }

        .timeline-detail .keyword-tag {
            display: inline-block;
            background: var(--accent-light);
            color: var(--accent);
            padding: 1px 8px;
            border-radius: 4px;
            font-size: 0.9em;
            margin: 2px 2px 0 0;
        }

        .timeline-detail .paper-title-mini {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 340px;
        }

        /* ── Status ── */
        .status-msg {
            text-align: center;
            font-size: 1em;
            font-weight: 500;
            color: var(--text-dim);
            margin-bottom: 8px;
        }
        .status-msg .detail { font-size: 0.84em; font-weight: 400; color: var(--text-light); margin-top: 3px; transition: opacity 0.3s; }
        .status-msg .elapsed { font-size: 0.78em; color: var(--text-light); margin-top: 4px; opacity: 0.5; }

        /* ── 2-Panel Results ── */
        .result-summary-header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 20px;
            background: var(--accent-bg);
            border-radius: var(--radius);
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .result-summary-header .summary-item {
            font-size: 0.86em;
            color: var(--text-dim);
            font-weight: 500;
        }

        .result-summary-header .summary-item strong {
            color: var(--accent);
            font-weight: 700;
        }

        .result-summary-header .summary-divider {
            width: 1px;
            height: 16px;
            background: var(--border);
        }

        .result-panels {
            display: flex;
            gap: 16px;
            min-height: 400px;
        }

        .panel-left {
            width: 35%;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 0;
            overflow-y: auto;
            max-height: calc(100vh - 320px);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            background: var(--surface);
        }

        .panel-section-header {
            padding: 12px 16px 8px;
            font-size: 0.78em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-light);
            background: var(--surface);
            position: sticky;
            top: 0;
            z-index: 1;
            border-bottom: 1px solid var(--border-light);
        }

        .gap-item-compact {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-light);
            border-left: 3px solid transparent;
            transition: all 0.15s;
        }

        .gap-item-compact:hover { background: var(--accent-bg); }
        .gap-item-compact.active { border-left-color: var(--accent); background: var(--accent-bg); }

        .gap-item-compact .gap-compact-rank {
            display: inline-block;
            font-size: 0.72em;
            font-weight: 700;
            padding: 1px 7px;
            border-radius: 4px;
            background: var(--accent-light);
            color: var(--accent);
            margin-right: 6px;
            vertical-align: middle;
        }

        .gap-item-compact .gap-compact-rank.top { background: var(--yellow-light); color: var(--yellow); }

        .gap-item-compact .gap-compact-axis {
            font-size: 0.75em;
            color: var(--text-light);
            display: inline;
            vertical-align: middle;
        }

        .gap-item-compact .gap-compact-statement {
            font-size: 0.88em;
            font-weight: 500;
            color: var(--text);
            margin-top: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .paper-item-compact {
            padding: 10px 16px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-light);
            border-left: 3px solid transparent;
            transition: all 0.15s;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .paper-item-compact:hover { background: var(--accent-bg); }
        .paper-item-compact.active { border-left-color: var(--accent); background: var(--accent-bg); }

        .paper-item-compact .paper-num {
            font-size: 0.78em;
            font-weight: 700;
            color: var(--text-light);
            flex-shrink: 0;
            min-width: 20px;
        }

        .paper-item-compact .paper-compact-info { flex: 1; min-width: 0; }

        .paper-item-compact .paper-compact-title {
            font-size: 0.86em;
            font-weight: 500;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .paper-item-compact .paper-compact-meta {
            font-size: 0.74em;
            color: var(--text-light);
            margin-top: 2px;
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .venue-badge {
            display: inline-block;
            background: var(--surface2);
            border: 1px solid var(--border-light);
            padding: 0 6px;
            border-radius: 4px;
            font-size: 0.92em;
            font-weight: 500;
            color: var(--text-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 120px;
        }

        .panel-right {
            flex: 1;
            min-width: 0;
            overflow-y: auto;
            max-height: calc(100vh - 320px);
        }

        .detail-panel {
            background: var(--surface);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-sm);
        }

        .detail-panel .detail-gap-statement {
            font-size: 1.15em;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 12px;
            line-height: 1.6;
        }

        .detail-panel .detail-gap-axis {
            font-size: 0.84em;
            color: var(--text-light);
            margin-bottom: 12px;
        }

        .detail-panel .detail-gap-elaboration {
            font-size: 0.98em;
            color: var(--text-dim);
            line-height: 1.75;
            margin-bottom: 16px;
        }

        .detail-panel .detail-section-title {
            font-size: 0.8em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--text-light);
            margin: 16px 0 8px;
        }

        .detail-panel .supporting-paper-chip {
            display: inline-block;
            background: var(--accent-light);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.82em;
            font-weight: 500;
            margin: 3px 4px 3px 0;
            cursor: pointer;
            transition: background 0.15s;
        }

        .detail-panel .supporting-paper-chip:hover { background: var(--accent); color: #fff; }

        .detail-panel .supporting-quote {
            font-size: 0.88em;
            color: var(--text-dim);
            font-style: italic;
            padding: 8px 14px;
            margin: 4px 0;
            border-left: 3px solid var(--border);
            background: var(--surface2);
            border-radius: 0 6px 6px 0;
        }

        .detail-panel .proposed-topic-box {
            padding: 14px 18px;
            background: linear-gradient(135deg, rgba(124,92,191,0.08), rgba(84,105,212,0.08));
            border-left: 3px solid var(--accent2);
            border-radius: 0 var(--radius) var(--radius) 0;
            margin-top: 16px;
        }

        .detail-panel .proposed-topic-box .topic-label {
            font-size: 0.78em;
            font-weight: 700;
            color: var(--accent2);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 4px;
        }

        .detail-panel .proposed-topic-box .topic-text {
            font-size: 0.98em;
            font-weight: 600;
            color: var(--accent2);
            line-height: 1.5;
        }

        .explore-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 14px;
            padding: 10px 20px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.88em;
            font-family: inherit;
            transition: background 0.15s, box-shadow 0.15s;
        }

        .explore-btn:hover { background: var(--accent-hover); box-shadow: 0 2px 8px rgba(84,105,212,0.25); }

        /* Paper detail */
        .detail-panel .paper-detail-title {
            font-size: 1.12em;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .detail-panel .paper-detail-meta {
            font-size: 0.84em;
            color: var(--text-light);
            margin-bottom: 6px;
            line-height: 1.6;
        }

        .detail-panel .paper-detail-abstract {
            font-size: 0.94em;
            color: var(--text-dim);
            line-height: 1.7;
            margin-top: 12px;
        }

        .detail-panel .paper-detail-link {
            display: inline-block;
            margin-top: 8px;
            color: var(--accent);
            font-weight: 500;
            text-decoration: none;
            font-size: 0.88em;
        }

        .detail-panel .paper-detail-link:hover { text-decoration: underline; }

        .detail-panel .paper-limitation-item {
            padding: 8px 12px;
            background: var(--surface2);
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 0.88em;
            color: var(--text-dim);
            line-height: 1.6;
        }

        /* ── Report Collapse ── */
        .report-collapse {
            margin-top: 16px;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            background: var(--surface);
            overflow: hidden;
        }

        .report-collapse-toggle {
            width: 100%;
            padding: 14px 20px;
            background: var(--surface);
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.92em;
            font-weight: 600;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.15s;
        }

        .report-collapse-toggle:hover { background: var(--surface2); }

        .report-collapse-toggle .toggle-arrow {
            transition: transform 0.2s;
            font-size: 0.8em;
        }

        .report-collapse.open .toggle-arrow { transform: rotate(180deg); }

        .report-collapse-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .report-collapse.open .report-collapse-body {
            max-height: 5000px;
        }

        .report-collapse-inner {
            padding: 0 20px 20px;
        }

        .report-actions { display: flex; gap: 8px; margin-bottom: 18px; }
        .report-actions button {
            padding: 8px 18px;
            font-size: 0.84em;
            font-family: inherit;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            color: var(--text-dim);
            cursor: pointer;
            font-weight: 500;
            transition: all 0.15s;
        }
        .report-actions button:hover { background: var(--surface2); color: var(--text); border-color: var(--accent); }

        /* ── Report Content ── */
        .report-content { font-size: 1.02em; line-height: 1.55; color: var(--text); }
        .report-content h1 { font-size: 1.45em; color: var(--text); margin: 20px 0 8px; padding-bottom: 6px; border-bottom: 2px solid var(--accent); font-weight: 700; }
        .report-content h2 { font-size: 1.25em; color: var(--text); margin: 16px 0 6px; padding: 4px 10px; font-weight: 700; background: linear-gradient(transparent 40%, rgba(99,102,241,0.18) 40%); display: inline-block; border-radius: 3px; }
        .report-content h3 { font-size: 1.1em; color: var(--accent); margin: 12px 0 6px; font-weight: 600; }
        .report-content h4 { font-size: 1em; color: var(--text); margin: 14px 0 6px; font-weight: 600; padding: 6px 12px; background: var(--surface2); border-left: 3px solid var(--accent); border-radius: 0 var(--radius) var(--radius) 0; }
        .report-content strong { color: var(--text); }
        .report-content table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 0.92em; }
        .report-content th { text-align: left; padding: 10px 12px; background: var(--surface2); color: var(--text-dim); font-weight: 600; font-size: 0.85em; text-transform: uppercase; letter-spacing: 0.3px; border-bottom: 2px solid var(--border); }
        .report-content td { padding: 9px 12px; border-bottom: 1px solid var(--border-light); color: var(--text); }
        .report-content tr:hover { background: var(--accent-bg); }
        .report-content code { background: var(--surface2); padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
        .report-content ul, .report-content ol { padding-left: 22px; margin: 4px 0; }
        .report-content li { margin-bottom: 3px; line-height: 1.6; }
        .report-content blockquote { border-left: 3px solid var(--accent); padding: 8px 14px; margin: 8px 0; background: var(--accent-bg); border-radius: 0 var(--radius) var(--radius) 0; font-style: italic; color: var(--text-dim); }
        .report-content hr { border: none; border-top: 1px solid var(--border-light); margin: 14px 0; }
        .report-content p { margin: 4px 0; }
        .report-content .gap-break { display: block; margin-top: 12px; }

        /* ── Interrupt ── */
        .interrupt-card {
            background: var(--surface);
            border: 2px solid var(--yellow);
            border-radius: var(--radius-lg);
            padding: 22px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }
        .interrupt-card h3 { color: var(--yellow); margin-bottom: 10px; font-size: 1em; }
        .interrupt-card .prompt { font-size: 0.9em; color: var(--text); margin-bottom: 14px; padding: 14px; background: var(--yellow-light); border-radius: var(--radius); line-height: 1.6; }
        .interrupt-card input {
            width: 100%;
            padding: 11px 14px;
            background: var(--surface2);
            color: var(--text);
            border: 1.5px solid var(--border);
            border-radius: 8px;
            margin-bottom: 12px;
            font-family: inherit;
            font-size: 0.9em;
            outline: none;
            transition: border-color 0.15s;
        }
        .interrupt-card input:focus { border-color: var(--yellow); }
        .interrupt-actions { display: flex; gap: 8px; }
        .interrupt-actions button {
            padding: 9px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.88em;
            font-family: inherit;
            transition: all 0.15s;
        }
        .btn-resume { background: var(--accent); color: #fff; }
        .btn-resume:hover { background: var(--accent-hover); }
        .btn-skip { background: var(--surface2); color: var(--text-dim); border: 1px solid var(--border); }
        .btn-skip:hover { background: var(--surface3); }

        /* ── Landing: Workflow Section ── */
        .workflow-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            margin: 28px auto 0;
            max-width: 680px;
            padding: 0 16px;
        }

        .workflow-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .workflow-step .wf-icon {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--accent-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .workflow-step .wf-label {
            font-size: 0.82em;
            font-weight: 600;
            color: var(--text);
            text-align: center;
        }

        .workflow-arrow {
            font-size: 1.2em;
            color: var(--text-light);
            margin: 0 -4px;
            padding-bottom: 24px;
        }

        /* ── Landing: Service Cards ── */
        .service-cards-section {
            max-width: 720px;
            margin: 32px auto 0;
            padding: 0 16px;
        }

        .service-cards-section h3 {
            text-align: center;
            font-size: 1.06em;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 16px;
        }

        .service-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }

        .service-card {
            background: var(--surface);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 20px 16px;
            text-align: center;
            box-shadow: var(--shadow-sm);
        }

        .service-card .sc-icon {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .service-card .sc-title {
            font-size: 0.9em;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 6px;
        }

        .service-card .sc-desc {
            font-size: 0.78em;
            color: var(--text-light);
            line-height: 1.5;
        }

        /* ── Empty state (examples) ── */
        .empty-state { text-align: center; padding: 60px 20px 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; }
        .empty-state .subtitle { font-size: 0.96em; color: var(--text-dim); line-height: 1.65; max-width: 520px; margin: 0 auto; }
        .example-queries { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 32px; max-width: 720px; margin-left: auto; margin-right: auto; }
        .example-queries .label { grid-column: 1 / -1; font-size: 0.8em; color: var(--text-light); margin-bottom: 0; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; text-align: center; }
        .example-card { background: var(--surface); border: 1px solid var(--border-light); border-radius: var(--radius-lg); padding: 16px; display: flex; flex-direction: column; gap: 6px; }
        .example-card .example-category { font-size: 0.78em; color: var(--accent); font-weight: 600; letter-spacing: 0.3px; margin: 0 0 4px; }
        .example-btn {
            background: var(--surface2);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 9px 14px;
            font-size: 0.86em;
            color: var(--text-dim);
            cursor: pointer;
            font-family: inherit;
            transition: all 0.15s;
            width: 100%;
            text-align: left;
        }
        .example-btn:hover { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }

        /* ── Error banner ── */
        .error-banner {
            background: var(--red-light);
            border: 1px solid var(--red);
            border-radius: var(--radius);
            padding: 16px 20px;
            margin-top: 16px;
            text-align: center;
        }
        .error-banner .msg { color: var(--red); font-size: 0.94em; font-weight: 500; margin-bottom: 10px; }
        .error-banner button {
            padding: 8px 20px;
            background: var(--red);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.88em;
            font-family: inherit;
            transition: opacity 0.15s;
        }
        .error-banner button:hover { opacity: 0.85; }

        /* ── GAP Axis Color Badges ── */
        .axis-badge {
            display: inline-block;
            font-size: 0.7em;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
            vertical-align: middle;
            white-space: nowrap;
        }

        /* ── Progress Bar ── */
        .preview-progress {
            margin-bottom: 16px;
            animation: fadeInUp 0.3s ease;
        }
        .preview-progress-label {
            font-size: 0.84em;
            color: var(--text-dim);
            font-weight: 500;
            margin-bottom: 6px;
        }
        .preview-progress-bar {
            width: 100%;
            height: 6px;
            background: var(--surface2);
            border-radius: 3px;
            overflow: hidden;
        }
        .preview-progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 3px;
            transition: width 0.4s ease;
        }
        .preview-progress-detail {
            font-size: 0.78em;
            color: var(--text-light);
            margin-top: 4px;
        }

        /* ── Query Preview ── */
        .preview-query-box {
            padding: 14px 16px;
            background: var(--accent-bg);
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            margin-bottom: 10px;
        }
        .preview-query-label {
            font-size: 0.75em;
            font-weight: 600;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 4px;
        }
        .preview-query-text {
            font-size: 0.94em;
            font-weight: 600;
            color: var(--text);
            line-height: 1.5;
        }
        .preview-keywords {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 8px;
        }
        .preview-keyword-tag {
            display: inline-block;
            background: var(--accent-light);
            color: var(--accent);
            padding: 2px 10px;
            border-radius: 5px;
            font-size: 0.82em;
            font-weight: 500;
        }

        /* ── Analysis Options Bar ── */
        .analysis-options-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .opt-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            background: var(--surface2);
            border: 1px solid var(--border-light);
            border-radius: 6px;
            font-size: 0.78em;
            color: var(--text-dim);
            font-weight: 500;
        }
        .opt-chip .opt-label { color: var(--text-light); font-weight: 400; margin-right: 2px; }

        /* ── Timeline Collapse ── */
        .timeline.collapsing {
            max-height: 600px;
            overflow: hidden;
            transition: max-height 0.6s ease, opacity 0.4s ease;
        }
        .timeline.collapsed {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        /* ── Analysis 2-Split Layout ── */
        .analysis-layout {
            max-width: 1100px;
            margin: 0 auto;
        }

        .analysis-status-bar {
            text-align: center;
            padding: 16px 20px 12px;
            margin-bottom: 8px;
        }
        .analysis-status-bar .status-text {
            font-size: 1em;
            font-weight: 600;
            color: var(--text);
        }
        .analysis-status-bar .status-detail {
            font-size: 0.84em;
            font-weight: 400;
            color: var(--text-light);
            margin-top: 3px;
            transition: opacity 0.3s;
        }
        .analysis-status-bar .status-detail .keyword-tag {
            display: inline-block;
            background: var(--accent-light);
            color: var(--accent);
            font-size: 0.85em;
            padding: 2px 8px;
            border-radius: 10px;
            margin: 2px 2px 0 0;
        }
        .analysis-status-bar .status-elapsed {
            font-size: 0.78em;
            color: var(--text-light);
            margin-top: 4px;
            opacity: 0.5;
        }

        .analysis-body {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .analysis-timeline-panel {
            width: 280px;
            flex-shrink: 0;
        }
        .analysis-timeline-panel .timeline {
            max-width: 100%;
            margin: 0;
            padding: 0;
        }

        .analysis-preview-panel {
            flex: 1;
            min-width: 0;
            background: var(--surface);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 20px;
            min-height: 300px;
            box-shadow: var(--shadow-sm);
        }

        .preview-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 260px;
            color: var(--text-light);
            font-size: 0.9em;
            text-align: center;
            gap: 8px;
        }
        .preview-empty .preview-icon { font-size: 2em; opacity: 0.4; }

        .preview-section {
            margin-bottom: 16px;
            animation: fadeInUp 0.3s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .preview-section-title {
            font-size: 0.78em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-light);
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--border-light);
        }

        .preview-paper-item {
            padding: 8px 12px;
            background: var(--surface2);
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 0.86em;
        }
        .preview-paper-item .preview-paper-title {
            font-weight: 500;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .preview-paper-item .preview-paper-meta {
            font-size: 0.82em;
            color: var(--text-light);
            margin-top: 2px;
        }

        .preview-limitation-item {
            padding: 8px 12px;
            background: var(--surface2);
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 0.84em;
            color: var(--text-dim);
            line-height: 1.5;
            border-left: 3px solid var(--yellow);
        }

        .preview-gap-card {
            padding: 12px 16px;
            background: linear-gradient(135deg, rgba(84,105,212,0.06), rgba(124,92,191,0.06));
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            margin-bottom: 8px;
        }
        .preview-gap-card .preview-gap-axis {
            font-size: 0.75em;
            color: var(--text-light);
            margin-bottom: 4px;
        }
        .preview-gap-card .preview-gap-statement {
            font-size: 0.9em;
            font-weight: 600;
            color: var(--text);
            line-height: 1.5;
        }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        /* ── Mobile ── */
        @media (max-width: 768px) {
            body { flex-direction: column; }

            .sidebar {
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
                border-right: none;
                border-bottom: 1px solid var(--border-light);
                max-height: none;
                overflow: visible;
            }
            .sidebar-header {
                flex: 1;
                padding: 12px 14px;
                border-bottom: none;
                min-width: 140px;
            }
            .sidebar-header h1 { font-size: 1em; }
            .new-btn {
                margin: 8px 10px;
                padding: 8px 14px;
                font-size: 0.78em;
                align-self: center;
            }
            .settings-section {
                display: flex;
                gap: 8px;
                padding: 8px 14px;
                border-bottom: none;
                width: 100%;
            }
            .settings-section label { display: none; }
            .settings-section select { margin-bottom: 0; font-size: 0.76em; }
            .history-section { display: none; }

            .main { height: calc(100vh - 90px); }
            .input-area { padding: 12px 12px 20px; max-width: 100%; }
            .input-row { gap: 6px; }
            .input-row textarea { padding: 10px 14px; font-size: 0.86em; }

            .results { padding: 16px; }

            .empty-state { padding: 40px 16px 30px; min-height: 50vh; }
            .empty-state h2 { font-size: 1.2em; }
            .empty-state .subtitle { font-size: 0.8em; }
            .empty-state .subtitle br { display: none; }
            .example-queries { grid-template-columns: 1fr; margin-top: 20px; }
            .example-btn { font-size: 0.78em; padding: 8px 14px; }

            .timeline { max-width: 100%; }
            .timeline-detail .paper-title-mini { max-width: 200px; }

            .result-panels { flex-direction: column; }
            .panel-left { width: 100%; max-height: 300px; }
            .panel-right { max-height: none; }

            .status-msg { font-size: 0.82em; }

            .analysis-body { flex-direction: column; }
            .analysis-timeline-panel { width: 100%; }
            .analysis-preview-panel { min-height: 200px; }

            .gap-item-compact .gap-compact-statement { font-size: 0.82em; }
            .paper-item-compact .paper-compact-title { font-size: 0.8em; }

            .detail-panel { padding: 16px; }

            .report-content { font-size: 0.84em; line-height: 1.7; }

            .interrupt-card { padding: 16px; }
            .interrupt-card .prompt { font-size: 0.8em; padding: 10px; }
        }

        @media (max-width: 420px) {
            .sidebar-header h1 { font-size: 0.9em; }
            .sidebar-header p { display: none; }
            .new-btn { font-size: 0.74em; padding: 7px 12px; margin: 6px 8px; }
            .settings-section { padding: 6px 10px; }
            .input-area { padding: 10px 12px 18px; max-width: 100%; }
            .input-row input { font-size: 0.8em; padding: 9px 10px; }
            .run-btn, .stop-btn { padding: 9px 14px; font-size: 0.8em; }
            .results { padding: 12px; }
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
    <div class="sidebar-header">
        <a href="#" onclick="event.preventDefault();newAnalysis();" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;cursor:pointer;">
            <img src="new_logo.png" alt="GAPAGO" style="width:36px;height:36px;border-radius:8px;object-fit:cover;">
            <div style="padding-top:2px;">
                <h1>GAPAGO</h1>
                <p>Research GAP Analyzer</p>
            </div>
        </a>

            <option value="5y">최근 5년</option>
        </select>
        <label>답변 언어</label>
        <select id="outputLanguage">
            <option value="auto">자동 (입력 언어 감지)</option>

    <div class="input-area" id="inputArea">
        <div class="input-row">
            <textarea id="queryInput" rows="1" placeholder="연구하고 싶은 주제를 입력하세요"
                      oninput="autoResizeTextarea(this); toggleSendBtn();"
                      onkeyup="toggleSendBtn();"
                      onpaste="setTimeout(toggleSendBtn, 0);"
                      onkeydown="handleInputKeydown(event)"></textarea>
            <button class="send-btn" id="sendBtn" onclick="handleSend()" disabled>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
            </button>
        </div>
    </div>

    <div id="chatMessages"></div>
</div>

<script>
// User ID
function getUserId() {
    let uid = localStorage.getItem('gapago_user_id');
    if (!uid) { uid = 'u_' + Math.random().toString(36).slice(2, 10); localStorage.setItem('gapago_user_id', uid); }
    return uid;
}
const USER_ID = getUserId();

window.onerror = function(msg, url, line) {
    const d = document.createElement('div');
    d.style.cssText = 'position:fixed;top:0;left:0;right:0;padding:10px;background:#e54e4e;color:#fff;z-index:9999;font-size:13px';
    d.textContent = `Error (line ${line}): ${msg}`;
    document.body.prepend(d);
};

// ── Timeline configuration ──
const TIMELINE_NODES = [
    { id: 'query', label: '질문 분석 & 검색어 확장', nodes: ['query_subgraph', 'meaning_expand'] },
    { id: 'retrieval', label: '논문 검색', nodes: ['paper_retrieval'] },
    { id: 'limitation', label: '한계점 추출', nodes: ['limitation_extract'] },
    { id: 'eval', label: '한계점 품질 평가', nodes: ['limitation_eval'] },

function getAxisColor(axisName) {

}

async function loadHistory() {
    try {
        const resp = await fetch(`api/history?user_id=${USER_ID}`);
        const items = await resp.json();
        const section = document.getElementById('historySection');
        section.innerHTML = '<h3>분석 히스토리</h3>';

        // Build parent-children map
        // parentMap: parentSessionId -> [child items]
        const parentMap = {};
        const roots = [];
        const sessionItemMap = {}; // sessionId -> item (for matching parents)

        items.forEach(item => {
            const sid = item.session_id || '';
            if (sid) sessionItemMap[sid] = item;
        });

        items.forEach(item => {
            const psid = item.parent_session_id || '';
            if (psid && sessionItemMap[psid]) {
                // This item has a parent that exists in the list
                if (!parentMap[psid]) parentMap[psid] = [];
                parentMap[psid].push(item);
            } else {
                roots.push(item);
            }
        });

        function renderHistoryItem(item) {
            const div = document.createElement('div');
            div.className = 'history-item';
            const ts = item.timestamp ? new Date(item.timestamp).toLocaleString('ko-KR', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
            if (item.status === 'running' || item.status === 'interrupted') {
                div.onclick = () => reconnectToSession(item.session_id, item.query);
                div.innerHTML = `<div class="query">${esc(item.query)}</div><div class="meta"><span class="running-badge">분석 중...</span> &middot; ${ts}</div>`;
            } else {
                div.onclick = () => loadResult(item.filename);
                div.innerHTML = `<div class="query">${esc(item.query)}</div><div class="meta">${ts} &middot; ${item.gaps_count} GAPs</div>`;
            }
            return div;
        }

        roots.forEach(item => {
            const sid = item.session_id || '';
            const children = sid ? (parentMap[sid] || []) : [];

            if (children.length > 0) {
                // Render as a group with toggle
                const group = document.createElement('div');
                group.className = 'history-group';

                // Parent item
                group.appendChild(renderHistoryItem(item));

                // Toggle button
                const toggle = document.createElement('button');
                toggle.className = 'history-toggle';
                toggle.innerHTML = `<span class="toggle-icon">&#x25BC;</span> 추가 탐색 ${children.length}건`;
                toggle.onclick = (e) => { e.stopPropagation(); group.classList.toggle('collapsed'); };
                group.appendChild(toggle);

                // Children container
                const childrenDiv = document.createElement('div');
                childrenDiv.className = 'history-children';
                children.forEach(child => {
                    childrenDiv.appendChild(renderHistoryItem(child));
                });
                group.appendChild(childrenDiv);

                section.appendChild(group);
            } else {
                // Standalone item
                section.appendChild(renderHistoryItem(item));
            }
        });

        if (!items.length) section.innerHTML += '<div style="padding:14px;color:var(--text-light);font-size:0.78em">아직 분석 기록이 없습니다.</div>';
    } catch (e) { console.error(e); }
}

async function connectToStream(sessionId, fromIdx, retries = 3) {
    const url = fromIdx ? `api/stream/${sessionId}?from_idx=${fromIdx}` : `api/stream/${sessionId}`;
    for (let attempt = 0; attempt < retries; attempt++) {
        const resp = await fetch(url);
        if (resp.ok) {
            await processStream(resp);
            return;
        }
        if (resp.status === 404 && attempt < retries - 1) {
            console.warn(`Stream 404, retrying (${attempt + 1}/${retries})...`);
            await new Promise(r => setTimeout(r, 500 * (attempt + 1)));
            continue;
        }
        showError(`스트림 오류 (${resp.status}): ${await resp.text()}`);
        setInputEnabled(true);
        return;
    }
}

        </div>`;
}

async function processStream(resp) {
    const reader = resp.body.getReader();
    _activeReader = reader;
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop() || '';
        for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            try { handleEvent(JSON.parse(line.slice(6))); } catch (e) { console.warn(e); }
        }
    }
}

function findTimelineStep(nodeName) {
    for (const tl of TIMELINE_NODES) {
        if (tl.nodes.includes(nodeName)) return tl.id;
    }
    return null;
}

function handleEvent(data) {
    if (data.event === 'keepalive') return;

    if (data.event === 'progress') {
        _progressData = { node: data.node || '', detail: data.detail || '', current: data.current || 0, total: data.total || 0, progress: data.progress || 0 };
        // Update timeline detail for this node
        const tlStep = findTimelineStep(data.node);
        if (tlStep) {
            timelineDetails[tlStep] = data.detail;
            const detailEl = document.getElementById(`tl-detail-${tlStep}`);
            if (detailEl) detailEl.innerHTML = esc(data.detail);
        }
        updateLivePreview();
        return;
    }

    if (data.event === 'node') {
        const tlStepId = findTimelineStep(data.node);
        if (tlStepId) updateTimeline(tlStepId, data.node);
        collectData(data);
    } else if (data.event === 'interrupt') {
        currentSessionId = data.session_id;
        showInterrupt(data.clarify_prompt);
    } else if (data.event === 'complete') {
        clearInterval(_thinkingInterval);
        clearInterval(_elapsedInterval);
        localStorage.removeItem('gapago_active_session');
        _activeReader = null;
        // Mark all timeline steps as done
        TIMELINE_NODES.forEach(n => {
            timelineState[n.id] = 'done';
        });
        renderTimelineState();
        const totalSecs = _startTime ? Math.floor((Date.now() - _startTime) / 1000) : 0;
        const tm = Math.floor(totalSecs / 60), ts = totalSecs % 60;
        // Remove analysis layout, show results only
        const results = document.getElementById('results');
        const completionInfo = `<div style="text-align:center;padding:12px 0 8px;"><span style="color:var(--done);font-weight:600;font-size:1em;">분석 완료</span><span style="color:var(--text-light);font-size:0.82em;margin-left:10px;">${tm > 0 ? tm + '분 ' : ''}${ts}초 소요</span></div>`;
        results.innerHTML = completionInfo + '<div id="resultArea" style="display:none"></div>';
        renderResults();
        setInputEnabled(true);
        switchToChatMode(currentSessionId);
        loadHistory();
    } else if (data.event === 'stopped') {
        clearInterval(_thinkingInterval);
        clearInterval(_elapsedInterval);
        localStorage.removeItem('gapago_active_session');
        _activeReader = null;
        const stoppedText = document.getElementById('statusText');
        if (stoppedText) { stoppedText.style.color = 'var(--red)'; stoppedText.textContent = '분석이 중지되었습니다'; }
        const stoppedDetail = document.getElementById('statusDetail');
        if (stoppedDetail) stoppedDetail.textContent = '';
        setInputEnabled(true);
    } else if (data.event === 'error') {
        clearInterval(_thinkingInterval);
        clearInterval(_elapsedInterval);
        localStorage.removeItem('gapago_active_session');
        _activeReader = null;
        showError(data.message);
        setInputEnabled(true);
    }
}

function updateTimeline(activeStepId, nodeName) {
    // Mark all steps before the active one as done, the active one as active
    let foundActive = false;
    for (let i = TIMELINE_NODES.length - 1; i >= 0; i--) {
        if (TIMELINE_NODES[i].id === activeStepId) { foundActive = true; break; }
    }

    if (!foundActive) return;

    let reachedActive = false;
    for (const tl of TIMELINE_NODES) {
        if (tl.id === activeStepId) {
            timelineState[tl.id] = 'active';
            reachedActive = true;
        } else if (!reachedActive) {
            timelineState[tl.id] = 'done';
        }
        // leave others as they are (pending or done)
    }

    renderTimelineState();

    // Update status bar
    const statusText = document.getElementById('statusText');
    const statusDetailEl = document.getElementById('statusDetail');
    const activeNode = TIMELINE_NODES.find(n => n.id === activeStepId);
    if (statusText && activeNode) {
        statusText.style.color = '';
        statusText.textContent = activeNode.label + '...';
    }
    if (statusDetailEl) {
        statusDetailEl.innerHTML = timelineDetails[activeStepId] || '';
    }

    // Thinking messages rotation
    clearInterval(_thinkingInterval);
    _thinkingInterval = setInterval(() => {
        const el = document.getElementById('statusDetail');
        if (el) el.textContent = THINKING_MESSAGES[Math.floor(Math.random() * THINKING_MESSAGES.length)];
    }, 8000);
}

function renderTimelineState() {
    TIMELINE_NODES.forEach(tl => {
        const el = document.getElementById(`tl-${tl.id}`);
        const iconEl = document.getElementById(`tl-icon-${tl.id}`);
        const detailEl = document.getElementById(`tl-detail-${tl.id}`);
        if (!el) return;

        const state = timelineState[tl.id] || 'pending';
        el.className = 'timeline-item ' + state;

        if (state === 'done') {
            iconEl.innerHTML = '&#x2713;';
        } else if (state === 'active') {
            iconEl.innerHTML = '&#x25C9;';
        } else {
            iconEl.innerHTML = '&#x25CB;';
        }

        if (detailEl) {
            detailEl.innerHTML = timelineDetails[tl.id] || '';
        }
    });
}

function collectData(data) {
    const node = data.node;

    if ((node === 'query_subgraph' || node === 'meaning_expand')) {
        if (data.refined_query) pipelineData.refined_query = data.refined_query;
        if (data.keywords) pipelineData.keywords = data.keywords;
        // Build detail text
        let detail = '';
        if (pipelineData.refined_query) detail += esc(pipelineData.refined_query);
        if (pipelineData.keywords && pipelineData.keywords.length) {
            detail += '<br>' + pipelineData.keywords.slice(0, 6).map(k => `<span class="keyword-tag">${esc(k)}</span>`).join(' ');
        }
        timelineDetails['query'] = detail;
    }

    if (node === 'paper_retrieval') {
        if (data.papers) pipelineData.papers = data.papers;
        if (data.total_searched) pipelineData.total_searched = data.total_searched;
        const totalS = pipelineData.total_searched || '?';
        const count = pipelineData.papers.length;
        let detail = `${totalS}편 중 ${count}편 선별`;
        // Show top 3 paper titles
        if (pipelineData.papers.length > 0) {
            const top3 = pipelineData.papers.slice(0, 3);
            detail += '<br>' + top3.map(p => `<div class="paper-title-mini">&#x2022; ${esc(p.title || '')}</div>`).join('');
        }
        timelineDetails['retrieval'] = detail;
    }

    if (node === 'limitation_extract') {
        if (data.limitations) pipelineData.limitations = data.limitations;
        const count = Array.isArray(pipelineData.limitations) ? pipelineData.limitations.length : 0;
        timelineDetails['limitation'] = `${count}개 한계점 추출`;
    }

    if (node === 'limitation_eval') {
        if (data.limitation_eval) pipelineData.limitation_eval = data.limitation_eval;
        // Try to show pass count
        const evalData = pipelineData.limitation_eval;
        if (evalData && evalData.passed_count !== undefined) {
            timelineDetails['eval'] = `${evalData.passed_count}개 통과`;
        } else if (evalData && evalData.decision) {
            timelineDetails['eval'] = esc(evalData.decision);
        } else {
            timelineDetails['eval'] = '품질 평가 완료';
        }
    }

    if (node === 'recency_check') {
        if (data.recency_status) pipelineData.recency_status = data.recency_status;
        const rs = pipelineData.recency_status;
        if (rs && (rs.unresolved !== undefined || rs.partial !== undefined || rs.resolved !== undefined)) {
            timelineDetails['recency'] = `미해결 ${rs.unresolved || 0} / 부분 ${rs.partial || 0} / 해결 ${rs.resolved || 0}`;
        } else {
            timelineDetails['recency'] = '최신성 검증 완료';
        }
    }

    if (node === 'gap_infer') {
        if (data.gaps) pipelineData.gaps = data.gaps;
        timelineDetails['gap'] = `${pipelineData.gaps.length}개 연구 GAP 도출`;
    }

    if (node === 'critic_score') {
        if (data.decision === 'ACCEPT' || (data.critic && data.critic.decision === 'ACCEPT')) {
            timelineDetails['critic'] = '품질 검증 통과';
        } else {
            timelineDetails['critic'] = '재검토 중...';
        }
    }

    if (node === 'final_response') {
        if (data.report) pipelineData.report = data.report;
        timelineDetails['report'] = '리포트 작성 완료';
    }

    // Update timeline detail display
    const tlStepId = findTimelineStep(node);
    if (tlStepId) {
        const detailEl = document.getElementById(`tl-detail-${tlStepId}`);
        if (detailEl) detailEl.innerHTML = timelineDetails[tlStepId] || '';
    }

    updateLivePreview();
}

function updateLivePreview() {
    const panel = document.getElementById('livePreview');
    if (!panel) return;

    const hasQuery = pipelineData.refined_query || (pipelineData.keywords && pipelineData.keywords.length);
    const hasPapers = pipelineData.papers.length > 0;
    const hasLimitations = pipelineData.limitations && pipelineData.limitations.length > 0;
    const hasGaps = pipelineData.gaps && pipelineData.gaps.length > 0;
    const hasProgress = _progressData.total > 0;

    if (!hasQuery && !hasPapers && !hasLimitations && !hasGaps && !hasProgress) return;

    let html = '';

    // Progress bar (limitation extraction etc.)
    if (hasProgress && !hasGaps) {
        html += `<div class="preview-progress">
            <div class="preview-progress-label">${esc(_progressData.detail)}</div>
            <div class="preview-progress-bar"><div class="preview-progress-fill" style="width:${_progressData.progress}%"></div></div>
            <div class="preview-progress-detail">${_progressData.current} / ${_progressData.total} (${_progressData.progress}%)</div>
        </div>`;
    }

    // GAPs
    if (hasGaps) {
        html += `<div class="preview-section"><div class="preview-section-title">연구 GAP (${pipelineData.gaps.length})</div>`;
        pipelineData.gaps.forEach(gap => {
            const axisLabel = gap.axis_label || gap.axis || '';
            const ac = getAxisColor(axisLabel);
            html += `<div class="preview-gap-card" style="border-left:3px solid ${ac.border}">
                <div class="preview-gap-axis"><span class="axis-badge" style="background:${ac.bg};color:${ac.color}">${esc(axisLabel)}</span></div>
                <div class="preview-gap-statement">${esc(gap.gap_statement || '')}</div>
            </div>`;
        });
        html += '</div>';
    }

    // Limitations
    if (hasLimitations) {
        const limCount = pipelineData.limitations.length;
        const showLims = pipelineData.limitations.slice(0, 5);
        html += `<div class="preview-section"><div class="preview-section-title">한계점 (${limCount})</div>`;
        showLims.forEach(l => {
            const text = l.limitation_text || l.text || l.content || '';
            html += `<div class="preview-limitation-item">${esc(truncate(text, 120))}</div>`;
        });
        if (limCount > 5) html += `<div style="text-align:center;color:var(--text-light);font-size:0.78em;padding:4px">외 ${limCount - 5}개...</div>`;
        html += '</div>';
    }

    // Papers
    if (hasPapers) {
        html += `<div class="preview-section"><div class="preview-section-title">검색된 논문 (${pipelineData.papers.length}/${pipelineData.total_searched || '?'})</div>`;
        pipelineData.papers.slice(0, 8).forEach(p => {
            html += `<div class="preview-paper-item">
                <div class="preview-paper-title">${esc(p.title || '')}</div>
                <div class="preview-paper-meta">${p.year || ''} ${p.venue ? '· ' + esc(p.venue) : ''}</div>
            </div>`;
        });
        if (pipelineData.papers.length > 8) html += `<div style="text-align:center;color:var(--text-light);font-size:0.78em;padding:4px">외 ${pipelineData.papers.length - 8}편...</div>`;
        html += '</div>';
    }

    // Query & Keywords (show at bottom as context)
    if (hasQuery) {
        html += `<div class="preview-section">`;
        if (pipelineData.refined_query) {
            html += `<div class="preview-query-box">
                <div class="preview-query-label">정제된 쿼리</div>
                <div class="preview-query-text">${esc(pipelineData.refined_query)}</div>
            </div>`;
        }
        if (pipelineData.keywords && pipelineData.keywords.length) {
            html += `<div class="preview-query-box">
                <div class="preview-query-label">확장 키워드</div>
                <div class="preview-keywords">${pipelineData.keywords.map(k => `<span class="preview-keyword-tag">${esc(k)}</span>`).join('')}</div>
            </div>`;
        }
        html += '</div>';
    }

    panel.innerHTML = html;
}

function getGapDetailHTML(index) {
    if (!pipelineData.gaps.length || index >= pipelineData.gaps.length) {
        return '<div style="padding:20px;color:var(--text-light);text-align:center">GAP을 선택하세요</div>';
    }
    const gap = pipelineData.gaps[index];
    const axisLabel = gap.axis_label || gap.axis || '';
    const ac = getAxisColor(axisLabel);

    let html = '';
    html += `<div class="detail-gap-axis"><span class="axis-badge" style="background:${ac.bg};color:${ac.color};font-size:0.82em;padding:3px 10px">${esc(axisLabel)}</span> <span style="margin-left:6px">${gap.repeat_count || 0}편 논문에서 도출</span></div>`;
    html += `<div class="detail-gap-statement">${esc(gap.gap_statement || '')}</div>`;
    html += `<div class="detail-gap-elaboration">${esc(gap.elaboration || '')}</div>`;

    // Supporting papers
    if (gap.supporting_papers && gap.supporting_papers.length) {
        html += `<div class="detail-section-title">근거 논문</div>`;
        html += '<div>';
        gap.supporting_papers.slice(0, 8).forEach(pid => {
            const idx = pipelineData.papers.findIndex(p => p.paper_id === pid);
            const title = idx !== -1 ? pipelineData.papers[idx].title : pid;
            html += `<span class="supporting-paper-chip" onclick="selectPaper(${idx !== -1 ? idx : 0})" title="${esc(title)}">${esc(truncate(title, 40))}</span>`;
        });
        html += '</div>';
    }

    // Supporting quotes
    if (gap.supporting_quotes && gap.supporting_quotes.length) {
        html += `<div class="detail-section-title">근거 인용</div>`;
        gap.supporting_quotes.slice(0, 4).forEach(q => {
            html += `<div class="supporting-quote">${esc(q)}</div>`;
        });
    }

    // Proposed topic
    if (gap.proposed_topic) {
        html += `<div class="proposed-topic-box">
            <div class="topic-label">제안 연구 방향</div>
            <div class="topic-text">${esc(gap.proposed_topic)}</div>
        </div>`;
        html += `<button class="explore-btn" onclick="exploreDirection('${esc(gap.proposed_topic).replace(/'/g, "\\'")}')">이 방향으로 추가 탐색 &#x2192;</button>`;
    }

    return html;
}

function getPaperDetailHTML(index) {
    if (!pipelineData.papers.length || index >= pipelineData.papers.length) {
        return '<div style="padding:20px;color:var(--text-light);text-align:center">논문을 선택하세요</div>';
    }
    const p = pipelineData.papers[index];

    let html = '';
    html += `<div class="paper-detail-title">${esc(p.title || '')}</div>`;

    let metaParts = [];
    if (p.authors && p.authors.length) metaParts.push(p.authors.slice(0, 5).join(', '));
    if (p.year) metaParts.push(p.year);
    if (p.venue) metaParts.push(`<span class="venue-badge">${esc(p.venue)}</span>`);
    html += `<div class="paper-detail-meta">${metaParts.join(' &middot; ')}</div>`;

    if (p.url) {
        html += `<a class="paper-detail-link" href="${esc(p.url)}" target="_blank" rel="noopener">논문 원문 보기 &#x2197;</a>`;
    }

    if (p.abstract) {
        html += `<div class="detail-section-title">초록</div>`;
        html += `<div class="paper-detail-abstract">${esc(p.abstract)}</div>`;
    }

    // Limitations from this paper
    if (pipelineData.limitations && pipelineData.limitations.length) {
        const paperLimitations = pipelineData.limitations.filter(l => l.paper_id === p.paper_id);
        if (paperLimitations.length) {
            html += `<div class="detail-section-title">이 논문의 한계점 (${paperLimitations.length})</div>`;
            paperLimitations.forEach(l => {
                html += `<div class="paper-limitation-item">${esc(l.limitation_text || l.text || l.content || JSON.stringify(l))}</div>`;
            });
        }
    }

    return html;
}

function selectGap(index) {
    selectedItem = { type: 'gap', index };
    // Update active state in left panel
    document.querySelectorAll('.gap-item-compact').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.paper-item-compact').forEach(el => el.classList.remove('active'));
    const el = document.getElementById(`gap-item-${index}`);
    if (el) el.classList.add('active');
    // Render right panel
    const dp = document.getElementById('detailPanel');
    if (dp) dp.innerHTML = getGapDetailHTML(index);
}

function selectPaper(index) {
    if (index < 0 || index >= pipelineData.papers.length) return;
    selectedItem = { type: 'paper', index };
    // Update active state
    document.querySelectorAll('.gap-item-compact').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.paper-item-compact').forEach(el => el.classList.remove('active'));
    const el = document.getElementById(`paper-item-${index}`);
    if (el) el.classList.add('active');
    // Render right panel
    const dp = document.getElementById('detailPanel');
    if (dp) dp.innerHTML = getPaperDetailHTML(index);
}

function toggleReport() {
    const rc = document.getElementById('reportCollapse');
    if (rc) rc.classList.toggle('open');
}

async function exploreDirection(topic) {
    // Fill query input and start new analysis
    document.getElementById('queryInput').value = topic;

    const provider = document.getElementById('provider').value;
    const domain = 'auto';
    const yearRange = document.getElementById('yearRange').value;
    const outputLanguage = document.getElementById('outputLanguage').value;

    setInputEnabled(false);
    pipelineData = { refined_query: '', keywords: [], papers: [], total_searched: 0, limitations: [], limitation_eval: {}, recency_status: {}, gaps: [], report: '', analysisOptions: {} };
    _progressData = { node: '', detail: '', current: 0, total: 0, progress: 0 };
    timelineDetails = {};
    timelineState = {};
    TIMELINE_NODES.forEach(n => { timelineState[n.id] = 'pending'; });
    _startTime = Date.now();
    clearInterval(_thinkingInterval);
    clearInterval(_elapsedInterval);

    showPipelineUI();

    try {
        // Try /api/explore first, fallback to /api/analyze
        let resp;
        try {
            const exploreParams = new URLSearchParams({ session_id: currentSessionId || '', topic, provider, domain, year_range: yearRange, output_language: outputLanguage, user_id: USER_ID });
            resp = await fetch(`api/explore?${exploreParams}`);
            if (!resp.ok) throw new Error('explore not available');
        } catch (e) {
            const params = new URLSearchParams({ query: topic, provider, domain, year_range: yearRange, output_language: outputLanguage, user_id: USER_ID });
            resp = await fetch(`api/analyze?${params}`);
        }

        if (!resp.ok) {
            showError(`API 오류 (${resp.status}): ${await resp.text()}`);
            setInputEnabled(true);
            return;
        }
        const { session_id } = await resp.json();
        currentSessionId = session_id;
        localStorage.setItem('gapago_active_session', session_id);
        loadHistory();

        await connectToStream(session_id);
    } catch (e) {
        showError(e.message);
    }
}

function showInterrupt(prompt) {
    const results = document.getElementById('results');
    const statusText = document.getElementById('statusText');

    const statusDetail = document.getElementById('statusDetail');
    if (statusDetail) statusDetail.textContent = '';
    const div = document.createElement('div');
    div.className = 'interrupt-card';
    div.id = 'interruptCard';
    const formatted = prompt ? esc(prompt).replace(/\n/g, '<br>') : '';
    div.innerHTML = `
        <h3>질의 명확화 필요</h3>
        ${formatted ? `<div class="prompt">${formatted}</div>` : ''}
        <input type="text" id="clarifyInput" placeholder="번호를 입력하거나 원하는 방향을 직접 입력하세요..." onkeydown="if(event.key==='Enter') resumePipeline()">
        <div class="interrupt-actions">
            <button class="btn-resume" onclick="resumePipeline()">계속</button>
            <button class="btn-skip" onclick="skipClarification()">건너뛰기 (현재 상태로 진행)</button>
        </div>
    `;
    results.appendChild(div);
    document.getElementById('clarifyInput').focus();
}

async function resumePipeline() {
    const input = document.getElementById('clarifyInput').value.trim();
    if (!input) return;
    await sendClarification(input);
}

async function skipClarification() { await sendClarification('proceed as is'); }

async function sendClarification(response) {
    const card = document.getElementById('interruptCard');
    if (card) card.remove();
    const statusText = document.getElementById('statusText');
    if (statusText) { statusText.style.color = ''; statusText.textContent = '분석 재개 중...'; }
    const statusDetail = document.getElementById('statusDetail');
    if (statusDetail) statusDetail.textContent = '입력을 처리하고 있습니다...';
    try {
        const params = new URLSearchParams({ session_id: currentSessionId, response });
        const resp = await fetch(`api/clarify?${params}`);
        if (!resp.ok) { showError(`명확화 오류 (${resp.status}): ${await resp.text()}`); return; }
        const data = await resp.json();
        await connectToStream(currentSessionId, data.events_count || 0);
    } catch (e) { showError(e.message); }
}

function renderSavedResult(data) {
    const results = document.getElementById('results');
    pipelineData = {
        refined_query: data.refined_query || '',
        keywords: data.keywords || [],
        papers: data.papers || [],
        total_searched: data.total_searched || 0,
        limitations: data.limitations || [],
        limitation_eval: data.limitation_eval || {},
        recency_status: data.recency_status || {},
        gaps: data.gaps || [],
        report: ((data.messages || []).find(m => m.name === 'final_response') || {}).content || data.report || '',
        analysisOptions: data.analysisOptions || {},
    };

    results.innerHTML = `
        <div style="margin-bottom:20px">
            <h3 style="font-size:1em;font-weight:600;margin-bottom:4px;color:var(--text)">${esc(data.query || '')}</h3>
            ${data.refined_query ? `<p style="color:var(--text-dim);font-size:0.8em">정제된 쿼리: ${esc(data.refined_query)}</p>` : ''}
            <p style="color:var(--text-light);font-size:0.7em;margin-top:3px">${data.timestamp || ''}</p>
        </div>
        <div id="resultArea" style="display:block"></div>
    `;

    // Need to set area reference before renderResults
    const area = document.getElementById('resultArea');
    if (area) {
        renderResults();
    }
}

function renderMarkdown(text) {
    text = text.replace(/FINAL\s*ANSWER\s*/gi, '');
    text = text.replace(/^[─━═┄┅┈┉╌╍]+$/gm, '---');
    text = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    // Parse tables
    text = text.replace(/(^\|.+\|$\n?)+/gm, function(tableBlock) {
        const rows = tableBlock.trim().split('\n').filter(r => r.trim());
        if (rows.length < 2) return tableBlock;
        let html = '<table>';
        let headerDone = false;
        rows.forEach((row) => {
            const cells = row.split('|').filter((c, j, a) => j > 0 && j < a.length).map(c => c.trim());
            if (cells.every(c => /^[-:\s]+$/.test(c))) { headerDone = true; return; }
            const tag = !headerDone ? 'th' : 'td';
            html += '<tr>' + cells.map(c => `<${tag}>${c}</${tag}>`).join('') + '</tr>';
            if (!headerDone) headerDone = true;
        });
        html += '</table>';
        return html;
    });

    return text
        .replace(/^---$/gm, '<hr>')
        .replace(/^#### (.+)$/gm, '<h4>$1</h4>')
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        .replace(/^# (.+)$/gm, '<h1>$1</h1>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>')
        .replace(/^- (.+)$/gm, '<li>$1</li>')
        .replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>')
        .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
        .replace(/(📌)/g, '<div class="gap-break"></div>$1')
        .replace(/\n{2,}/g, '<br><br>')
        .replace(/\n/g, '<br>');
}

function copyReport() {
    navigator.clipboard.writeText(pipelineData.report).then(() => {
        const btn = document.querySelector('.report-actions button');
        if (!btn) return;
        const orig = btn.textContent;
        btn.textContent = '복사 완료!';
        setTimeout(() => btn.textContent = orig, 1500);
    });
}

function downloadReport() {
    const blob = new Blob([pipelineData.report], { type: 'text/markdown' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'gapago_report.md';
    a.click();
    URL.revokeObjectURL(a.href);
}

function truncate(str, max) {
    if (!str) return '';
    return str.length > max ? str.slice(0, max) + '...' : str;
}

function esc(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function richText(str) {
    if (!str) return '';
    let s = esc(str);
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(?<!\w)_(.+?)_(?!\w)/g, '<em>$1</em>');
    s = s.replace(/\n/g, '<br>');
    return s;
}
